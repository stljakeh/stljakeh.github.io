name: city2-leaders

# Server-side prefetch of St. Louis CITY2 career scoring leaders from the MLS
# stats API. League-wide player pages are cursor-paginated (~270 rows, ~900 KB
# each, 1200+ players), so this stays out of the browser. Regenerates
# Sports/data/city2-leaders.json, which the dashboard reads same-origin.
# Staggered off the other refresh schedules.
on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CITY2 leaders JSON
        run: python3 Sports/tools/build-city2.py
      - name: Commit if changed
        run: |
          git config user.name "city2-bot"
          git config user.email "city2-bot@users.noreply.github.com"
          git add Sports/data/city2-leaders.json
          git diff --cached --quiet || (git commit -m "chore: refresh CITY2 leaders" && git push)
