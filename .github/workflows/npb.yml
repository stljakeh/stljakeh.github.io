name: npb-lastgame-data

# Server-side prefetch of the Rakuten Eagles' last game (npb.jp sends no CORS
# headers, so browsers can't scrape the official team calendar directly).
# Regenerates Sports/data/npb-lastgame.json, which the dashboard reads
# same-origin. Staggered off the affiliates schedule.
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build NPB last-game JSON
        run: python3 Sports/tools/build-npb.py
      - name: Commit if changed
        run: |
          git config user.name "npb-bot"
          git config user.email "npb-bot@users.noreply.github.com"
          git add Sports/data/npb-lastgame.json
          git diff --cached --quiet || (git commit -m "chore: refresh NPB last-game data" && git push)
