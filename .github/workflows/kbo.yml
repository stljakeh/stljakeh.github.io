name: kbo-lastgame-data

# Server-side prefetch of the NC Dinos' last game (www.ncdinos.com sends no
# CORS headers, and the month API needs a JSON POST). Regenerates
# Sports/data/kbo-lastgame.json, which the dashboard reads same-origin.
# Staggered off the other refresh schedules.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build KBO last-game JSON
        run: python3 Sports/tools/build-kbo.py
      - name: Commit if changed
        run: |
          git config user.name "kbo-bot"
          git config user.email "kbo-bot@users.noreply.github.com"
          git add Sports/data/kbo-lastgame.json
          git diff --cached --quiet || (git commit -m "chore: refresh KBO last-game data" && git push)
