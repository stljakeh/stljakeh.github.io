name: transactions-prefetch-data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build transactions JSON
        run: python3 Sports/tools/build-transactions.py
      - name: Commit if changed
        run: |
          git config user.name "espn-bot"
          git config user.email "espn-bot@users.noreply.github.com"
          git add Sports/data/transactions.json
          git diff --cached --quiet || (git commit -m "chore: refresh transactions data" && git push)
