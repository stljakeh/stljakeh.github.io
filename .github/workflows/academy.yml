name: academy-data

# Server-side prefetch of St. Louis CITY academy records (footyaccess.com
# serves per-age-group MLS NEXT aggregates server-rendered but sends no CORS
# headers). Regenerates Sports/data/city-academy.json, which the dashboard
# reads same-origin. Staggered off the other refresh schedules.
on:
  schedule:
    - cron: '48 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build academy JSON
        run: python3 Sports/tools/build-academy.py
      - name: Commit if changed
        run: |
          git config user.name "academy-bot"
          git config user.email "academy-bot@users.noreply.github.com"
          git add Sports/data/city-academy.json
          git diff --cached --quiet || (git commit -m "chore: refresh academy data" && git push)
