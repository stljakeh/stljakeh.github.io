name: coaches-data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync St. Louis Coaches JSON
        run: python3 Sports/tools/build-coaches.py
      - name: Commit if changed
        run: |
          git config user.name "coaches-bot"
          git config user.email "coaches-bot@users.noreply.github.com"
          git add Sports/data/coaches.json
          git diff --cached --quiet || (git commit -m "chore: refresh coaches data" && git push)
