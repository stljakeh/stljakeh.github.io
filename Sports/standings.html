<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings - St. Louis Sports</title>
<link rel="stylesheet" href="css/theme.css">
<style>
#app { width: 100%; }
.standings-section {
  background: var(--card);
  color: var(--card-ink);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(var(--ink-rgb), 0.1);
  border: 1px solid rgba(var(--ink-rgb), 0.07);
}
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid rgba(var(--ink-rgb), 0.1);
}
.section-header h2 { font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.section-team { font-size: 0.75rem; color: var(--card-mute); text-transform: uppercase; letter-spacing: 0.5px; }
.standings-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: var(--card-ink); }
.table-wrap { overflow-x: auto; }
.standings-table th {
  text-align: left; padding: 8px 12px; font-size: 0.7rem;
  color: var(--card-mute); text-transform: uppercase; letter-spacing: 1px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.1); font-weight: 600;
}
.standings-table th.num, .standings-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.standings-table td {
  padding: 8px 12px; border-bottom: 1px solid rgba(var(--ink-rgb), 0.07); white-space: nowrap;
}
.standings-table tr:hover td { background: rgba(var(--ink-rgb), 0.03); }
.highlight td { color: var(--card-ink); font-weight: 700; background: rgba(var(--ink-rgb), 0.05); }
.highlight td:first-child { border-left: 3px solid; padding-left: 9px; }
.team-cell { display: flex; align-items: center; gap: 8px; }
.team-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
.strk-w { color: #1c7a35; font-weight: 700; }
.strk-l { color: var(--danger); font-weight: 700; }
.strk-t { color: #a86a00; font-weight: 700; }
.strk-dot { display: inline-block; width: 22px; text-align: center; }
@media (max-width: 640px) {
  .standings-table { font-size: 0.78rem; }
  .standings-table th, .standings-table td { padding: 6px 8px; white-space: normal; }
  .standings-table th.num, .standings-table td.num { white-space: nowrap; }
  .team-logo { display: none; }
  .strk-dot { width: 16px; font-size: 0.7rem; }
}
.error-msg { text-align: center; color: var(--danger); padding: 40px; }
.loading { text-align: center; color: var(--card-mute); padding: 40px; }
</style>
<link rel="stylesheet" href="css/nav.css">
</head>
<body class="themed">
<script src="js/theme.js"></script>

<div class="shell">
  <header class="masthead">
    <div class="wordmark">
      <div class="wm-kicker">ST. LOUIS</div>
      <div class="wm-title">Sports <em>Ledger</em></div>
    </div>
    <button class="menu-btn" aria-label="Menu" onclick="document.getElementById('sitenav').classList.toggle('open')">&#9776;</button>
  </header>

  <nav class="stlnav">
    <div class="nav-links" id="sitenav">
      <a href="dashboard.html">Dashboard</a>
      <a href="news.html">News</a>
      <a class="current" href="standings.html">Standings</a>
      <a href="rosters.html">Rosters</a>
      <a href="stats.html">Stats</a>
      <a href="others.html">Others</a>
      <a href="FPR.html">FPR</a>
      <button class="nav-theme-btn" type="button" data-theme-toggle>Dark mode</button>
    </div>
  </nav>

<div id="app">
  <div class="mini-hero">
    <h1>Standings</h1>
    <div class="sub" id="feedSub">Loading...</div>
  </div>
  <div id="standingsContent"><div class="loading">Loading standings...</div></div>
</div>
</div>

<script>
// Western Conference: MLS three-letter code -> ESPN team id (for logos + highlight).
// Verified against stats-api 2026-09-25 (30 codes league-wide; LAG's code is 'LA').
var MLSWEST = [
  { code: 'COL', espn: '184' },
  { code: 'DAL', espn: '185' },
  { code: 'SKC', espn: '186' },
  { code: 'LA', espn: '187' },
  { code: 'HOU', espn: '6077' },
  { code: 'RSL', espn: '4771' },
  { code: 'SJ', espn: '191' },
  { code: 'POR', espn: '9723' },
  { code: 'SEA', espn: '9726' },
  { code: 'VAN', espn: '9727' },
  { code: 'MIN', espn: '17362' },
  { code: 'LAFC', espn: '18966' },
  { code: 'ATX', espn: '20906' },
  { code: 'STL', espn: '21812' },
  { code: 'SD', espn: '22529' }
];

// MLS season id is per-season; next year's comes from mlssoccer.com's currentSeasonSportecId.
var MLS_SEASON_ID = 'MLS-SEA-0001KA';
var MLS_COMPETITION_ID = 'MLS-COM-000001';

// Direct fetch with localStorage cache. stats-api.mlssoccer.com sends
// Access-Control-Allow-Origin: *, so no CORS proxy is needed.
function cachedDirectFetch(url, ttlMs) {
  var key = 'mls_' + btoa(url);
  ttlMs = ttlMs || 3600000;
  try {
    var cached = JSON.parse(localStorage.getItem(key));
    if (cached && Date.now() < cached.expiry) return Promise.resolve(cached.data);
  } catch (e) {}
  return fetch(url).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data) {
    try { localStorage.setItem(key, JSON.stringify({ data: data, expiry: Date.now() + ttlMs })); } catch (e) {}
    return data;
  });
}

function fetchMlsMatches() {
  var url = 'https://stats-api.mlssoccer.com/matches/seasons/' + MLS_SEASON_ID +
    '?competition_id=' + MLS_COMPETITION_ID +
    '&match_date%5Bgte%5D=2026-02-01&match_date%5Blte%5D=2026-12-31' +
    '&per_page=1000&sort=planned_kickoff_time%3Aasc';
  return cachedDirectFetch(url, 6 * 3600000).then(function(data) {
    return (data && data.schedule) || [];
  });
}

var DIVISIONS = [
  {
    id: 'cardinals', name: 'NL Central', team: 'Cardinals', teamId: '24', color: '#C41E3A',
    url: 'https://site.web.api.espn.com/apis/v2/sports/baseball/mlb/standings?group=8', childId: '5',
    cols: ['W','L','PCT','GB','STRK'], statNames: ['wins','losses','winPercent','gamesBehind','streak'],
    fmt: { winPercent:'pct', gamesBehind:'gb' }
  },
  {
    id: 'blues', name: 'Central Division', team: 'Blues', teamId: '19', color: '#003087',
    url: 'https://site.web.api.espn.com/apis/v2/sports/hockey/nhl/standings?group=8', childId: '31',
    cols: ['W','L','OTL','PTS','STRK'], statNames: ['wins','losses','overtimeLosses','points','streak'],
    fmt: {}
  },
  {
    id: 'citysc', name: 'Western Conference', team: 'CITY SC', teamId: '21812', color: '#E80A4D',
    url: 'https://site.web.api.espn.com/apis/v2/sports/soccer/usa.1/standings?group=2', childId: null,
    cols: ['W','L','T','PTS','STRK'], statNames: ['wins','losses','ties','points','streak'],
    fmt: {}
  },
  {
    id: 'battlehawks', name: 'UFL', team: 'BattleHawks', teamId: '112651', color: '#00529B',
    url: 'https://site.web.api.espn.com/apis/v2/sports/football/ufl/standings', childId: null,
    cols: ['W','L','PCT','STRK'], statNames: ['wins','losses','winPercent','streak'],
    fmt: { winPercent:'pct' }
  },
];

function getStat(entries, name) {
  var s = entries.find(function(e) { return e.name === name; });
  return s || null;
}

function fmtPct(v) {
  var n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toFixed(3).replace(/^0/, '');
}

function fmtGb(v) {
  if (v === '-' || v === '0') return '-';
  var n = parseFloat(v);
  if (isNaN(n)) return v;
  return n % 1 === 0 ? String(Math.round(n)) : n.toFixed(1);
}

function formatStat(s, fmtType) {
  if (!s) return '&mdash;';
  var v = s.displayValue || String(s.value);
  if (!v) return '&mdash;';
  if (fmtType === 'pct') return fmtPct(v);
  if (fmtType === 'gb') return fmtGb(v);
  return v;
}

async function loadStandings() {
  var container = document.getElementById('standingsContent');
  var sub = document.getElementById('feedSub');
  try {
    // Kick off the MLS fetch alongside ESPN; render ESPN first, patch MLS in after.
    var mlsMatchesP = fetchMlsMatches();
    var results = await Promise.all(DIVISIONS.map(function(d) {
      return fetch(d.url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
    }));

    // Render ESPN data immediately so a slow proxy never gates the whole page.
    renderTables(results);

    var mlsResult = results[2];
    if (mlsResult) {
      try {
        var matches = await mlsMatchesP;
        if (applyMlsOverride(mlsResult, matches)) {
          renderTables(results);
        }
      } catch (e) {}
    }
  } catch (e) {
    container.innerHTML = '<div class="error-msg">Failed to load standings.</div>';
    sub.textContent = 'Error';
  }
}

function espnMlsEntries(mlsResult) {
  if (mlsResult.children) {
    var wc = mlsResult.children.find(function(c) { return c.name && c.name.indexOf('Western') !== -1; });
    if (wc && wc.standings) return wc.standings.entries || [];
  } else if (mlsResult.standings) {
    return mlsResult.standings.entries || [];
  }
  return [];
}

function applyMlsOverride(mlsResult, matches) {
  if (!matches || !matches.length) return false;
  // ESPN fallback streak per team so a missing MLS form never renders a blank cell.
  var espnStreakById = {};
  espnMlsEntries(mlsResult).forEach(function(e) {
    var s = getStat(e.stats || [], 'streak');
    if (e.team && e.team.id != null && s) espnStreakById[String(e.team.id)] = s.displayValue || String(s.value);
  });
  var std = {};
  var names = {};
  var formGames = {};
  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    if (m.match_status !== 'finalWhistle') continue;
    var hc = m.home_team_three_letter_code;
    var ac = m.away_team_three_letter_code;
    if (hc == null || ac == null || m.home_team_goals == null || m.away_team_goals == null) continue;
    if (!std[hc]) std[hc] = { w:0, l:0, d:0, pts:0 };
    if (!std[ac]) std[ac] = { w:0, l:0, d:0, pts:0 };
    names[hc] = m.home_team_name;
    names[ac] = m.away_team_name;
    if (m.home_team_goals > m.away_team_goals) { std[hc].w++; std[hc].pts += 3; std[ac].l++; }
    else if (m.away_team_goals > m.home_team_goals) { std[ac].w++; std[ac].pts += 3; std[hc].l++; }
    else { std[hc].d++; std[ac].d++; std[hc].pts++; std[ac].pts++; }
    if (!formGames[hc]) formGames[hc] = [];
    if (!formGames[ac]) formGames[ac] = [];
    formGames[hc].push({ code: hc, score: m.home_team_goals, oppScore: m.away_team_goals, date: m.planned_kickoff_time });
    formGames[ac].push({ code: ac, score: m.away_team_goals, oppScore: m.home_team_goals, date: m.planned_kickoff_time });
  }
  var newEntries = MLSWEST.map(function(t) {
    var s = std[t.code] || { w:0, l:0, d:0, pts:0 };
    var name = names[t.code] || '?';
    var formArr = (formGames[t.code] || [])
      .sort(function(a, b) { return new Date(b.date) - new Date(a.date); })
      .slice(0, 5)
      .map(function(g) {
        if (g.score == null || g.oppScore == null) return null;
        if (g.score > g.oppScore) return 'W';
        if (g.score < g.oppScore) return 'L';
        return 'D';
      })
      .filter(function(x) { return x !== null; });
    var streakVal = formArr.length ? formArr.join('-') : (espnStreakById[t.espn] || '');
    return {
      team: {
        id: t.espn,
        displayName: name,
        logos: [{ href: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/soccer/500-dark/' + t.espn + '.png' }]
      },
      stats: [
        { name: 'wins', value: s.w, displayValue: String(s.w) },
        { name: 'losses', value: s.l, displayValue: String(s.l) },
        { name: 'ties', value: s.d, displayValue: String(s.d) },
        { name: 'points', value: s.pts, displayValue: String(s.pts) },
        { name: 'streak', value: streakVal, displayValue: streakVal }
      ]
    };
  });
  newEntries.sort(function(a, b) {
    var aPts = a.stats.find(function(x) { return x.name === 'points'; }).value;
    var bPts = b.stats.find(function(x) { return x.name === 'points'; }).value;
    return bPts - aPts;
  });
  if (mlsResult.children) {
    var wc = mlsResult.children.find(function(c) { return c.name && c.name.indexOf('Western') !== -1; });
    if (!wc || !wc.standings) return false;
    wc.standings.entries = newEntries;
  } else if (mlsResult.standings) {
    mlsResult.standings.entries = newEntries;
  } else {
    return false;
  }
  return true;
}

function renderTables(results) {
  var container = document.getElementById('standingsContent');
  var sub = document.getElementById('feedSub');
  try {
    var html = '';
    var loaded = 0;
    DIVISIONS.forEach(function(d, i) {
      var data = results[i];
      if (!data) return;
      var entries;
      if (d.childId) {
        var child = (data.children || []).find(function(c) { return c.id === d.childId; });
        if (!child || !child.standings) return;
        entries = child.standings.entries;
      } else {
        entries = data.standings ? data.standings.entries : null;
        if (!entries && data.children) {
          var match = data.children.find(function(c) { return c.name && c.name.includes(d.name); });
          if (match && match.standings) entries = match.standings.entries;
        }
      }
      if (!entries || !entries.length) return;
      entries.sort(function(a, b) {
        var aPts = getStat(a.stats || [], 'points');
        var bPts = getStat(b.stats || [], 'points');
        return (parseFloat(bPts ? bPts.value : 0) || 0) - (parseFloat(aPts ? aPts.value : 0) || 0);
      });
      loaded++;
      html += '<div class="standings-section">' +
        '<div class="section-header" style="border-bottom-color:' + d.color + ';">' +
          '<h2 style="color:' + d.color + ';">' + d.name + '</h2>' +
          '<span class="section-team">' + d.team + '</span>' +
        '</div>' +
        '<div class="table-wrap"><table class="standings-table"><thead><tr>' +
          '<th style="width:28px;">#</th><th>Team</th>' +
          d.cols.map(function(c) { return '<th class="num">' + c + '</th>'; }).join('') +
        '</tr></thead><tbody>';
      entries.forEach(function(entry, idx) {
        var stats = entry.stats || [];
        var isOurs = entry.team && String(entry.team.id) === d.teamId;
        var logo = entry.team && entry.team.logos && entry.team.logos[0] ? entry.team.logos[0].href : null;
        var name = entry.team ? (entry.team.displayName || entry.team.name || entry.team.location) : '?';
        html += '<tr class="' + (isOurs ? 'highlight' : '') + '">' +
          '<td>' + (idx + 1) + '</td>' +
          '<td><div class="team-cell">' +
            (logo ? '<img class="team-logo" src="' + logo + '" alt="" loading="lazy">' : '') +
            '<span class="team-name">' + (isOurs ? '<strong>' + name + '</strong>' : name) + '</span>' +
          '</div></td>';
        d.statNames.forEach(function(sn) {
          if (sn === 'streak') {
            var s = getStat(stats, sn);
            var val = formatStat(s, null);
            if (val && val.indexOf('-') !== -1) {
              var parts = val.split('-').map(function(l) {
                var cls = l === 'W' ? 'strk-w' : l === 'L' ? 'strk-l' : 'strk-t';
                return '<span class="strk-dot ' + cls + '">' + l + '</span>';
              }).join('');
              html += '<td class="num">' + parts + '</td>';
            } else if (!val || val === '&mdash;') {
              html += '<td class="num">&mdash;</td>';
            } else {
              var cls = val[0] === 'W' ? 'strk-w' : val[0] === 'L' ? 'strk-l' : 'strk-t';
              html += '<td class="num ' + cls + '">' + val + '</td>';
            }
          } else {
            var s = getStat(stats, sn);
            var fmt = d.fmt[sn] || null;
            var val = formatStat(s, fmt);
            html += '<td class="num">' + val + '</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    if (!loaded) {
      container.innerHTML = '<div class="error-msg">Could not load standings data.</div>';
      sub.textContent = 'Error';
      return;
    }
    sub.textContent = loaded + ' division' + (loaded !== 1 ? 's' : '');
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div class="error-msg">Failed to load standings.</div>';
    sub.textContent = 'Error';
  }
}
loadStandings();
setInterval(loadStandings, 60000);
</script>
</body>
</html>
