<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
#app { width: 100%; }
.roster-section {
  background: var(--card);
  color: var(--card-ink);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(var(--ink-rgb),0.1);
  border: 1px solid rgba(var(--ink-rgb),0.07);
}
.roster-section .rbody { display: none; margin-top: 4px; }
.roster-section.open .rbody { display: block; }
.roster-section .details-btn { margin-top: 0; flex-shrink: 0; }
/* Blues identity goes gold on dark mode (deep blue turns muddy) — matches the dashboard cards. */
html[data-theme="dark"] .roster-section[data-team="blues"] .section-header { border-bottom-color: #FCB514 !important; }
html[data-theme="dark"] .roster-section[data-team="blues"] .section-header h2 { color: #FCB514 !important; }
html[data-theme="dark"] .roster-section[data-team="blues"] tr.group-row td { color: #FCB514 !important; }
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid rgba(var(--ink-rgb),.1);
}
.section-header h2 { font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.section-team { font-size: 0.75rem; color: var(--card-mute); text-transform: uppercase; letter-spacing: 0.5px; }
.section-avg { font-size: 0.72rem; color: var(--card-mute); font-variant-numeric: tabular-nums; letter-spacing: 0.3px; }
.roster-section.open .section-avg { display: none; }
.roster-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.table-wrap { overflow-x: auto; }
.roster-table th {
  text-align: left; padding: 8px 10px; font-size: 0.7rem;
  color: var(--card-mute); text-transform: uppercase; letter-spacing: 1px;
  border-bottom: 1px solid rgba(var(--ink-rgb),.1); font-weight: 600;
}
.roster-table th.num, .roster-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.roster-table td {
  padding: 6px 10px; border-bottom: 1px solid rgba(var(--ink-rgb),.07); white-space: nowrap;
  color: var(--card-ink);
}
.roster-table tr:hover td { background: rgba(var(--ink-rgb),.045); }
.roster-table tr.group-row:hover td { background: none; }
.roster-table tr.group-row td {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--card-mute); padding: 10px 10px 4px; border-bottom: none;
}
.player-name { font-weight: 600; }
.roster-table tfoot td { font-weight: 700; border-top: 2px solid rgba(var(--ink-rgb),.15); }
.muted { color: var(--card-mute); }
.error-msg { text-align: center; color: var(--danger); padding: 40px; }
.loading { text-align: center; color: var(--card-mute); padding: 40px; }
@media (max-width: 640px) {
  .section-header { flex-wrap: wrap; }
  .roster-table { font-size: 0.78rem; }
  .roster-table th, .roster-table td { padding: 6px 8px; white-space: normal; }
}
</style>
<link rel="stylesheet" href="css/nav.css">

<script src="js/utils.js"></script>

<script>
var TEAMS = [
  {
    id: 'cardinals', name: 'St. Louis Cardinals', color: '#C41E3A',
    type: 'espn', sport: 'baseball', slug: 'mlb', teamId: '24',
    posGroups: null
  },
  {
    id: 'blues', name: 'St. Louis Blues', color: '#003087',
    type: 'espn', sport: 'hockey', slug: 'nhl', teamId: '19',
    posGroups: null
  },
  {
    id: 'citysc', name: 'St. Louis CITY SC', color: '#E80A4D',
    type: 'espn', sport: 'soccer', slug: 'usa.1', teamId: '21812',
    posLabels: { G: 'Goalkeepers', D: 'Defenders', M: 'Midfielders', F: 'Forwards' }
  },
  {
    id: 'battlehawks', name: 'St. Louis Battlehawks', color: '#00529B',
    type: 'ufl', teamId: '1', showAge: true
  },
  {
    id: 'siue', name: 'SIUE', color: '#C8102E',
    type: 'espn', sport: 'basketball', slug: 'mens-college-basketball', teamId: '2565',
    showAge: false,
    posLabels: { G: 'Guards', F: 'Forwards', C: 'Centers',
                 'F/G': 'F/G', 'G/F': 'G/F', 'F/C': 'F/C', 'C/F': 'C/F' }
  }
];

var UFL_OFF = ['QB','RB','FB','WR','TE','OT','OG','C','G','OL'];
var UFL_DEF = ['DL','DE','DT','NT','LB','OLB','ILB','MLB','CB','S','FS','SS','DB'];
var UFL_ST  = ['K','P','LS'];

function uflGroup(pos) {
  if (UFL_ST.indexOf(pos) !== -1) return 'Special Teams';
  if (UFL_DEF.indexOf(pos) !== -1) return 'Defense';
  return 'Offense';
}

function fmtHeightInches(h) {
  var n = parseFloat(h);
  if (!isFinite(n)) return '&mdash;';
  var ft = Math.floor(n / 12), inch = Math.round(n % 12);
  return ft + "' " + inch + '"';
}

function fmtWeight(w) {
  var n = parseFloat(w);
  if (!isFinite(n)) return '&mdash;';
  return String(n % 1 === 0 ? n : n.toFixed(1));
}

// Players whose names are blanked on this page (matched case-insensitively).
// The row itself still renders — jersey, position, and measurements intact.
var HIDDEN_PLAYERS = ['dillon dube'];

// Manual fill-ins for players whose feeds lack measurements.
// Key: 'teamId|lowercase name'. Only used when the feed value is missing;
// feed values always win. { htIn: inches, wtLb: lbs, birthDate: 'YYYY-MM-DD' }.
var MANUAL_MEASUREMENTS = {
  'citysc|tomas totland':      { wtLb: 163 },
  'citysc|fallou fall':        { wtLb: 176 },
  'citysc|tahir reid-brown':   { wtLb: 175 },
  'citysc|brendan mcsorley':   { wtLb: 163 },
  'citysc|zackory campagnolo': { wtLb: 174 },
  'citysc|mykhi joyner':       { htIn: 70, wtLb: 150 },
  'citysc|tyson pearce':       { htIn: 71, wtLb: 165 },
  'citysc|zach zengue':        { wtLb: 161 },
  'citysc|caden glover':       { wtLb: 176 },
  'battlehawks|shane watts':     { birthDate: '2002-04-01' },
  'battlehawks|trevor mayberry': { birthDate: '2002-08-03' }
};

// Players missing from a team's live feed but still worth showing.
// Key: team id. { name, pos, jersey, htIn, wtLb, college, hometown, birthDate }.
var MANUAL_PLAYERS = {
  battlehawks: [
    { name: 'John Sullivan', pos: 'DT', jersey: null, htIn: 73, wtLb: 292,
      college: 'North Central College', hometown: '', birthDate: '2004-06-14' }
  ]
};

// Players dropped from display entirely: row removed, excluded from the
// player count and the averages. Key format matches MANUAL_MEASUREMENTS.
// Battlehawks: feed still carries 2026 names; official 2027 pre-draft
// graphic (Nov 12, 2026) protects 35 and these are not among them.
var REMOVED_PLAYERS = [
  'citysc|riley lynch',
  'citysc|colin welsh',
  'battlehawks|a.j. thomas',
  'battlehawks|abdul beecham',
  'battlehawks|abraham beauplan',
  'battlehawks|brandon silvers',
  'battlehawks|daniel isom',
  'battlehawks|jahcour pearson',
  'battlehawks|kameron kelly',
  'battlehawks|luis perez',
  'battlehawks|luq barcoo',
  'battlehawks|michael ojemudia',
  'battlehawks|pita taumoepenu',
  'battlehawks|que mcbroom',
  'battlehawks|myles sims'
];

function playerKey(teamId, name) {
  return teamId + '|' + String(name == null ? '' : name).toLowerCase();
}

function isRemoved(teamId, name) {
  return REMOVED_PLAYERS.indexOf(playerKey(teamId, name)) !== -1;
}

function manualFor(teamId, name) {
  return MANUAL_MEASUREMENTS[playerKey(teamId, name)] || null;
}

function numOrNull(v) {
  if (v == null || v === '') return null;
  var n = parseFloat(v);
  return isFinite(n) ? n : null;
}

function ageFromBirthDate(value) {
  var m = String(value == null ? '' : value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  var y = +m[1], mo = +m[2], day = +m[3];
  if (!y || !mo || !day) return null;
  var now = new Date();
  var age = now.getFullYear() - y;
  var cm = now.getMonth() + 1;
  if (cm < mo || (cm === mo && now.getDate() < day)) age--;
  return age;
}

function fmtHtIn(inches) {
  var n = numOrNull(inches);
  if (n == null) return null;
  var r = Math.round(n);
  return Math.floor(r / 12) + "' " + (r % 12) + '"';
}

var esc = STL.utils.escHtml;
var ROSTER_CACHE_TTL = 6 * 3600000;
function rosterCacheKey(id) { return 'stl_roster_v1_' + id; }

function rosterRow(player, jersey, pos, ht, wt, extra, showAge) {
  var name = player.displayName || player.full_name || '';
  if (HIDDEN_PLAYERS.indexOf(String(name).toLowerCase()) !== -1) name = '';
  return '<tr>' +
    '<td class="num"><span class="muted">' + (jersey ? esc(jersey) : '&mdash;') + '</span></td>' +
    '<td><span class="player-name">' + esc(name) + '</span></td>' +
    '<td>' + esc(pos) + '</td>' +
    '<td>' + ht + '</td>' +
    '<td>' + wt + '</td>' +
    (extra ? '<td class="' + (extra.extraClass || '') + '">' + extra.html + '</td>' : '') +
    (showAge !== false ? '<td class="num muted">' + (player.age != null ? player.age : '&mdash;') + '</td>' : '') +
    '</tr>';
}

function rosterAverages(groups) {
  var nHt = 0, sumHt = 0, nWt = 0, sumWt = 0, nAge = 0, sumAge = 0;
  groups.forEach(function(g) {
    g.items.forEach(function(item) {
      var hi = numOrNull(item.htIn);
      if (hi != null) { nHt++; sumHt += hi; }
      var wl = numOrNull(item.wtLb);
      if (wl != null) { nWt++; sumWt += wl; }
      var ag = numOrNull(item.player && item.player.age);
      if (ag != null) { nAge++; sumAge += ag; }
    });
  });
  return {
    ht: nHt ? fmtHtIn(sumHt / nHt) : null,
    wt: nWt ? Math.round(sumWt / nWt) : null,
    age: nAge ? (Math.round(sumAge / nAge * 10) / 10).toFixed(1) : null
  };
}

function headerAvgHtml(team, groups) {
  var a = rosterAverages(groups);
  var parts = [];
  if (a.ht) parts.push(a.ht);
  if (a.wt != null) parts.push(a.wt + ' lbs');
  if (team.showAge !== false && a.age) parts.push(a.age + ' yrs');
  if (!parts.length) return '';
  return '<span class="section-avg">Avg ' + parts.join(' &middot; ') + '</span>';
}

function tableHtml(cols, groups) {
  var colCount = 5 + (cols.extra ? 1 : 0) + (cols.showAge !== false ? 1 : 0);
  var html = '<div class="table-wrap"><table class="roster-table"><thead><tr>' +
    '<th class="num" style="width:28px;">#</th><th>Name</th><th>Pos</th><th>Ht</th><th>Wt</th>' +
    (cols.extra ? '<th>' + cols.extra + '</th>' : '') +
    (cols.showAge !== false ? '<th class="num">Age</th>' : '') +
    '</tr></thead><tbody>';
  groups.forEach(function(g) {
    html += '<tr class="group-row"><td colspan="' + colCount + '" style="color:' + (cols.color || '#888') + ';">' + esc(g.name) + '</td></tr>';
    var rows = g.items.map(function(item) {
      var extra = null;
      if (cols.extra) {
        var bits = [item.college, item.hometown].filter(Boolean);
        extra = { html: bits.map(esc).join(' &middot; ') || '&mdash;', extraClass: 'muted' };
      }
      return rosterRow(item.player, item.jersey, item.pos, item.ht || '&mdash;', item.wt || '&mdash;', extra, cols.showAge);
    });
    html += rows.join('');
  });
  html += '</tbody>';
  var avg = rosterAverages(groups);
  html += '<tfoot><tr class="avg-row">' +
    '<td class="num"></td>' +
    '<td><span class="player-name">Avg</span></td>' +
    '<td></td>' +
    '<td>' + (avg.ht || '&mdash;') + '</td>' +
    '<td>' + (avg.wt != null ? String(avg.wt) + ' lbs' : '&mdash;') + '</td>' +
    (cols.extra ? '<td></td>' : '') +
    (cols.showAge !== false ? '<td class="num muted">' + (avg.age || '&mdash;') + '</td>' : '') +
    '</tr></tfoot>';
  return html + '</table></div>';
}

function renderRoster(team, groups) {
  var cols = {
    extra: team.type === 'ufl' ? 'College &middot; Hometown' : null,
    showAge: team.showAge,
    color: team.color
  };
  return tableHtml(cols, groups);
}

function espnItem(team, p) {
  var man = manualFor(team.id, p.displayName);
  var htIn = numOrNull(p.height);
  if (htIn == null && man && man.htIn != null) htIn = man.htIn;
  var wtLb = numOrNull(p.weight);
  if (wtLb == null && man && man.wtLb != null) wtLb = man.wtLb;
  if (p.age == null && man) {
    var manAge = ageFromBirthDate(man.birthDate);
    if (manAge == null && man.age != null) manAge = man.age;
    if (manAge != null) p.age = manAge;
  }
  return {
    player: p,
    jersey: p.jersey,
    pos: p.position ? p.position.abbreviation : '',
    ht: htIn != null ? fmtHtIn(htIn) : '&mdash;',
    wt: wtLb != null ? String(Math.round(wtLb)) + ' lbs' : '&mdash;',
    htIn: htIn,
    wtLb: wtLb
  };
}

function espnGroups(team, data) {
  var ath = data.athletes || [];
  if (!ath.length) return [];
  if (Array.isArray(ath[0].items)) {
    return ath.map(function(g) {
      return {
        name: g.position,
        items: g.items.map(function(p) { return espnItem(team, p); })
      };
    });
  }
  var labels = team.posLabels || {};
  var byPos = {};
  ath.forEach(function(p) {
    var ab = p.position ? p.position.abbreviation : '';
    var key = ab || '?';
    if (!byPos[key]) byPos[key] = [];
    byPos[key].push(espnItem(team, p));
  });
  return Object.keys(byPos).sort().map(function(ab) {
    return { name: labels[ab] || ab, items: byPos[ab] };
  });
}

async function fetchEspn(team) {
  var url = 'https://site.api.espn.com/apis/site/v2/sports/' + team.sport + '/' + team.slug + '/teams/' + team.teamId + '/roster';
  var resp = await STL.shared.fetchWithTimeout(url, 8000);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return espnGroups(team, await resp.json());
}

async function fetchUfl() {
  var listResp = await STL.shared.fetchWithTimeout('https://www.theufl.com/api/rosters?filter[team_id]=1&include=season', 8000);
  if (!listResp.ok) throw new Error('HTTP ' + listResp.status);
  var list = (await listResp.json()).data || [];
  var reg = list
    .filter(function(r) { return String(r.team_id) === '1' && r.season && r.season.title && r.season.title.indexOf('Postseason') === -1; })
    .sort(function(a, b) { return new Date(b.season.start_date) - new Date(a.season.start_date); });
  var roster = reg[0];
  if (!roster) throw new Error('no roster');
  var detailResp = await STL.shared.fetchWithTimeout(
    'https://www.theufl.com/api/rosters/' + roster.id + '?include=visiblePlayerRosters.photo,visiblePlayerRosters.player.photo', 8000
  );
  if (!detailResp.ok) throw new Error('HTTP ' + detailResp.status);
  var detail = await detailResp.json();
  var prs = detail.data && detail.data.visible_player_rosters;
  if (!prs || !prs.length) throw new Error('empty roster');
  var byGroup = {};
  var seen = {};
  prs.forEach(function(pr) {
    var p = pr.player || {};
    seen[String(p.full_name || '').toLowerCase()] = true;
    var pos = pr.position || p.position || '';
    var g = uflGroup(pos);
    if (!byGroup[g]) byGroup[g] = [];
    var man = manualFor('battlehawks', p.full_name);
    var htIn = numOrNull(p.height);
    if (htIn == null && man && man.htIn != null) htIn = man.htIn;
    var wtLb = numOrNull(p.weight);
    if (wtLb == null && man && man.wtLb != null) wtLb = man.wtLb;
    var age = ageFromBirthDate(p.birth_date || (man && man.birthDate));
    if (age == null && man && man.age != null) age = man.age;
    byGroup[g].push({
      player: { displayName: p.full_name, age: age, photo: p.photo ? p.photo.src : null, headshot: null },
      jersey: pr.jersey_number || p.jersey_number,
      pos: pos,
      ht: htIn != null ? fmtHeightInches(htIn) : '&mdash;',
      wt: wtLb != null ? fmtWeight(wtLb) : '&mdash;',
      htIn: htIn,
      wtLb: wtLb,
      college: p.college,
      hometown: p.birth_place
    });
  });
  (MANUAL_PLAYERS.battlehawks || []).forEach(function(m) {
    if (seen[String(m.name).toLowerCase()]) return;
    var g = uflGroup(m.pos);
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push({
      player: { displayName: m.name, age: ageFromBirthDate(m.birthDate), photo: null, headshot: null },
      jersey: m.jersey,
      pos: m.pos,
      ht: m.htIn != null ? fmtHeightInches(m.htIn) : '&mdash;',
      wt: m.wtLb != null ? fmtWeight(m.wtLb) : '&mdash;',
      htIn: m.htIn,
      wtLb: m.wtLb,
      college: m.college,
      hometown: m.hometown
    });
  });
  var order = ['Offense', 'Defense', 'Special Teams'];
  return order.filter(function(g) { return byGroup[g]; }).map(function(g) {
    return { name: g, items: byGroup[g] };
  });
}

function filterRosterGroups(team, rawGroups) {
  var groups = (rawGroups || []).map(function(g) {
    return {
      name: g.name,
      items: (g.items || []).filter(function(item) {
        var nm = item.player && (item.player.displayName || item.player.full_name);
        return !isRemoved(team.id, nm);
      })
    };
  }).filter(function(g) { return g.items.length > 0; });
  return groups;
}

function renderRosterSectionInner(team, groups) {
  var count = groups.reduce(function(n, g) { return n + g.items.length; }, 0);
  return '<div class="section-header" style="border-bottom-color:' + esc(team.color) + ';">' +
    '<h2 style="color:' + esc(team.color) + ';">' + esc(team.name) + '</h2>' +
    '<span class="section-team">' + (team.type === 'ufl' ? 'theufl.com' : 'ESPN') + ' &middot; ' + count + ' players</span>' +
    headerAvgHtml(team, groups) +
    '<button class="details-btn" type="button" data-roster="' + esc(team.id) + '" style="margin-left:auto">' +
      (window._rosterOpen && window._rosterOpen[team.id] ? '\u2013 close' : '+ details') +
    '</button>' +
  '</div><div class="rbody">' + renderRoster(team, groups) + '</div>';
}

function applyRosterSection(team, groups) {
  var sec = document.getElementById('rsec-' + team.id);
  if (!sec) return;
  sec.innerHTML = renderRosterSectionInner(team, groups);
  if (window._rosterOpen && window._rosterOpen[team.id]) {
    sec.classList.add('open');
  } else {
    sec.classList.remove('open');
  }
}

async function loadRosters() {
  var container = document.getElementById('rostersContent');
  window._rosterOpen = window._rosterOpen || {};

  if (!document.getElementById('rsec-' + TEAMS[0].id)) {
    container.innerHTML = TEAMS.map(function(team) {
      return '<div class="roster-section" id="rsec-' + esc(team.id) + '" data-team="' + esc(team.id) + '">' +
        '<div class="section-header" style="border-bottom-color:' + esc(team.color) + ';">' +
          '<h2 style="color:' + esc(team.color) + ';">' + esc(team.name) + '</h2>' +
        '</div><div class="loading">Loading…</div></div>';
    }).join('');
  }

  await Promise.all(TEAMS.map(async function(team) {
    var cachedRaw = STL.shared.readCache(rosterCacheKey(team.id));
    var cachedGroups = cachedRaw ? filterRosterGroups(team, cachedRaw) : null;
    if (cachedGroups && cachedGroups.length) {
      applyRosterSection(team, cachedGroups);
    }
    try {
      var rawGroups = team.type === 'ufl' ? await fetchUfl() : await fetchEspn(team);
      var groups = filterRosterGroups(team, rawGroups);
      if (!groups.length) throw new Error('empty roster');
      STL.shared.writeCache(rosterCacheKey(team.id), rawGroups, ROSTER_CACHE_TTL);
      applyRosterSection(team, groups);
    } catch (e) {
      if (!cachedGroups || !cachedGroups.length) {
        var sec = document.getElementById('rsec-' + team.id);
        if (sec) {
          sec.innerHTML = '<div class="section-header" style="border-bottom-color:' + esc(team.color) + ';">' +
            '<h2 style="color:' + esc(team.color) + ';">' + esc(team.name) + '</h2>' +
          '</div><div class="error-msg">Could not load roster.</div>';
        }
      }
    }
  }));
}

window._rosterOpen = window._rosterOpen || {};
if (!window._rosterToggleWired) {
  window._rosterToggleWired = true;
  document.getElementById('rostersContent').addEventListener('click', function(e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-roster]') : null;
    if (!btn) return;
    var card = btn.closest('.roster-section');
    if (!card) return;
    var open = card.classList.toggle('open');
    btn.textContent = open ? '\u2013 close' : '+ details';
    window._rosterOpen[btn.getAttribute('data-roster')] = open;
  });
}

loadRosters();
setInterval(loadRosters, 60000);
</script>
</body>
</html>
