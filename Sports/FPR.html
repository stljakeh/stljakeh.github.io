<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPR</title>
<style>
  :root { --bg: #12181a; --amber: #f2b134; --text: #e8e4d9; --muted: #8a9490; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .lock {
    width: 100%;
    max-width: 320px;
    padding: 32px;
    text-align: center;
  }
  .lock .eyebrow {
    letter-spacing: 0.25em;
    color: var(--amber);
    font-size: 11px;
    font-weight: 700;
  }
  .lock h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 4px 0 24px;
  }
  .lock input {
    width: 100%;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    border: 1px solid #2c3b34;
    background: #0d1210;
    color: var(--text);
    text-align: center;
    margin-bottom: 12px;
  }
  .lock button {
    width: 100%;
    padding: 11px;
    border-radius: 4px;
    background: var(--amber);
    color: #12181a;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }
  .lock button:disabled { opacity: 0.5; cursor: not-allowed; }
  .err { display: none; font-size: 12px; color: #e8a3a3; margin-top: 12px; }
  .sub { font-size: 11px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
  <div class="lock">
    <div class="eyebrow">PERSONAL</div>
    <h1>Forest Park Rangers</h1>
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <div class="err" id="err">Wrong password.</div>
    <div class="sub">Content is encrypted. Enter the password to decrypt.</div>
  </div>

function b64ToBuf(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBuf(BLOB.salt), iterations: BLOB.iter, hash: BLOB.hash },
    material,
    { name: "AES-CBC", length: 256 },
    false,
    ["decrypt"]
  );
}

async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  const btn = document.getElementById("unlockBtn");
  if (!pw) return;
  btn.disabled = true;
  btn.textContent = "Unlocking...";
  try {
    const key = await deriveKey(pw);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: b64ToBuf(BLOB.iv) }, key, b64ToBuf(BLOB.ct));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Unlock";
    err.style.display = "block";
  }
}

document.getElementById("unlockBtn").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
document.getElementById("pw").focus();
</script>
