<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaches - St. Louis Sports</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<style>
#app { width: 100%; }

.coaches-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.coaches-head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.expand-all-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--page-ink);
  padding: 5px 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.expand-all-btn:hover { background: rgba(var(--ink-rgb), 0.06); }
.expand-all-btn:disabled { opacity: 0.55; cursor: wait; }

.coach-head-main {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.coach-mono {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--team, var(--hero));
  color: #fff;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.92rem;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
}

html[data-theme="dark"] .team-blues .coach-mono {
  color: #171114;
}

.coach-title-wrap { min-width: 0; }

.coach-record-wrap {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.coach-record-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin-top: 1px;
}

.coach-change-banner {
  margin-top: 10px;
  padding: 7px 10px;
  border-radius: 9px;
  background: rgba(var(--ink-rgb), 0.05);
  border-left: 3px solid var(--team, var(--accent));
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--card-ink);
}

.coach-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 11px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(var(--ink-rgb), 0.04);
  border: 1px solid rgba(var(--ink-rgb), 0.07);
}

.coach-metric-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--card-mute);
}

.coach-metric-val {
  font-family: var(--mono);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--card-ink);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.coach-metric-sub {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--card-mute);
  margin-top: 1px;
}

.coach-summary {
  margin-top: 10px;
  font-size: 0.84rem;
  line-height: 1.52;
  color: var(--card-ink);
}

.coach-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
}

.coach-note-tag {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--team, var(--accent));
  font-weight: 700;
}

.coach-subhead {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin: 14px 0 6px;
}

.coach-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(var(--ink-rgb), 0.025);
}

.coach-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 0.75rem;
}

.coach-table th {
  text-align: left;
  padding: 7px 9px;
  font-size: 0.62rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--card-mute);
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}

.coach-table td {
  padding: 6px 9px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.06);
  color: var(--card-ink);
  font-variant-numeric: tabular-nums;
}

.coach-table th.num,
.coach-table td.num {
  text-align: right;
  white-space: nowrap;
}

.coach-table tbody tr:last-child td { border-bottom: none; }

.coach-table tfoot td {
  font-weight: 700;
  border-top: 1px solid var(--line);
  background: rgba(var(--ink-rgb), 0.04);
}

.coach-live-pill {
  display: inline-block;
  font-size: 0.58rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #1c7a35;
  font-weight: 700;
  margin-left: 4px;
}

html[data-theme="dark"] .coach-live-pill { color: var(--live-accent); }

.coach-honors {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 4px;
}

.coach-honor-item {
  font-size: 0.79rem;
  line-height: 1.45;
  color: var(--card-ink);
  padding-left: 11px;
  position: relative;
}

.coach-honor-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--team, var(--accent));
}

.loading {
  text-align: center;
  color: var(--card-mute);
  padding: 40px;
  font-size: 0.9rem;
}

@media (max-width: 540px) {
  .coach-metrics { grid-template-columns: 1fr; gap: 6px; }
  .trow1 { flex-wrap: wrap; }
  .coach-record-wrap { margin-left: 49px; text-align: left; }
}
</style>
</head>

<script src="js/utils.js"></script>
<script src="js/shared.js"></script>
<script>
(function() {
  var esc = STL.utils.escHtml;
  var CACHE_KEY = 'stl_coaches_v1';
  var CACHE_TTL = 10 * 60 * 1000;
  var openState = {};
  var currentCoaches = [];

  function calcTenure(isoDate) {
    if (!isoDate || !/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) {
      return { short: 'Recent', detail: 'Recently appointed', days: 0 };
    }
    var parts = isoDate.split('-').map(Number);
    var start = new Date(parts[0], parts[1] - 1, parts[2]);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (!isFinite(start) || today < start) return { short: '0 mos', detail: 'Upcoming', days: 0 };

    var years = today.getFullYear() - start.getFullYear();
    var months = today.getMonth() - start.getMonth();
    var days = today.getDate() - start.getDate();

    if (days < 0) {
      months -= 1;
      var prevMonthDays = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      days += prevMonthDays;
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }

    var totalDays = Math.round((today - start) / 86400000);
    var bits = [];
    if (years > 0) bits.push(years + (years === 1 ? ' yr' : ' yrs'));
    if (months > 0 || years === 0) bits.push(months + (months === 1 ? ' mo' : ' mos'));
    return {
      short: bits.join(', '),
      detail: bits.join(', ') + ' (' + totalDays.toLocaleString('en-US') + ' days)',
      days: totalDays
    };
  }

  function calcAge(birthIso) {
    if (!birthIso || !/^\d{4}-\d{2}-\d{2}$/.test(birthIso)) return null;
    var parts = birthIso.split('-').map(Number);
    var now = new Date();
    var age = now.getFullYear() - parts[0];
    var m = (now.getMonth() + 1) - parts[1];
    if (m < 0 || (m === 0 && now.getDate() < parts[2])) age -= 1;
    return age;
  }

  function fmtBirthDate(birthIso) {
    if (!birthIso || !/^\d{4}-\d{2}-\d{2}$/.test(birthIso)) return '';
    var parts = birthIso.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderCoachCard(c) {
    var tenure = calcTenure(c.hiredDate);
    var age = calcAge(c.birthDate);
    var ageText = age != null ? (age + ' (' + fmtBirthDate(c.birthDate) + ')') : '—';
    var isOpen = !!openState[c.id];

    var seasonRows = (c.seasons || []).map(function(s) {
      return '<tr>' +
        '<td>' + esc(s.season) + (s.live ? '<span class="coach-live-pill">Active</span>' : '') + '</td>' +
        '<td class="num">' + esc(s.record) + '</td>' +
        '<td class="num">' + esc(s.rate) + '</td>' +
        '<td>' + esc(s.finish) + '</td>' +
      '</tr>';
    }).join('');

    var careerRows = (c.careerRows || []).map(function(r) {
      return '<div class="stat-row">' +
        '<span class="stat-label">' + esc(r.label) + '</span>' +
        '<span class="stat-value">' + esc(r.value) + '</span>' +
      '</div>';
    }).join('');

    var honorItems = (c.honors || []).map(function(h) {
      return '<div class="coach-honor-item">' + esc(h) + '</div>';
    }).join('');

    var linksHtml = (c.links || []).map(function(l) {
      var ext = l.href.indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + esc(l.href) + '"' + ext + '>' + esc(l.text) + ' &rarr;</a>';
    }).join('');

    var changeBanner = c.autoUpdated && c.previousCoach
      ? '<div class="coach-change-banner">Coaching change auto-detected via ' + esc(c.detectedSource || 'live feed') + ' &middot; Succeeds ' + esc(c.previousCoach.name) + ' (' + esc(c.previousCoach.record) + ')</div>'
      : '';

    return '<article class="teamcard ' + esc(c.teamClass) + (isOpen ? ' open' : '') + '" data-coach="' + esc(c.id) + '">' +
      '<div class="tmain">' +
        '<div class="trow1">' +
          '<div class="coach-head-main">' +
            '<div class="coach-mono" aria-hidden="true">' + esc(c.initials) + '</div>' +
            '<div class="coach-title-wrap">' +
              '<div class="tname">' + esc(c.name) + '</div>' +
              '<div class="tleague">' + esc(c.team) + ' &middot; ' + esc(c.league) + ' ' + esc(c.role) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="coach-record-wrap">' +
            '<div class="trecord" id="rec-' + esc(c.id) + '">' + esc(c.headlineRecord) + '</div>' +
            '<div class="coach-record-label">' + esc(c.headlineLabel) + '</div>' +
          '</div>' +
        '</div>' +

        changeBanner +

        '<div class="coach-metrics">' +
          '<div>' +
            '<div class="coach-metric-label">Tenure</div>' +
            '<div class="coach-metric-val">' + esc(tenure.short) + '</div>' +
            '<div class="coach-metric-sub">Hired ' + esc(c.hiredDisplay) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="coach-metric-label">Pace / Pct</div>' +
            '<div class="coach-metric-val">' + esc(c.rateValue) + '</div>' +
            '<div class="coach-metric-sub">' + esc(c.rateSub) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="coach-metric-label">Postseason / Hardware</div>' +
            '<div class="coach-metric-val">' + esc(c.postseasonValue) + '</div>' +
            '<div class="coach-metric-sub">' + esc(c.postseasonSub) + '</div>' +
          '</div>' +
        '</div>' +

        '<p class="coach-summary">' + esc(c.bio) + '</p>' +

        '<div class="coach-actions">' +
          '<button class="details-btn" type="button" data-toggle-coach="' + esc(c.id) + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' + (isOpen ? '\u2013 close' : '+ details') + '</button>' +
          '<span class="coach-note-tag">' + esc(c.highlightTag) + '</span>' +
        '</div>' +

        '<div class="tbody">' +
          '<div class="coach-subhead">Profile &amp; Tenure</div>' +
          '<div class="stat-row"><span class="stat-label">Appointment</span><span class="stat-value">' + esc(c.hiredDisplay) + ' &middot; ' + esc(c.franchiseNumber) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Tenure Length</span><span class="stat-value">' + esc(tenure.detail) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Age &amp; Born</span><span class="stat-value">' + esc(ageText) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Birthplace</span><span class="stat-value">' + esc(c.birthPlace || '—') + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Alma Mater</span><span class="stat-value">' + esc(c.almaMater || '—') + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Status</span><span class="stat-value">' + esc(c.contractNote || '—') + '</span></div>' +

          '<div class="coach-subhead">St. Louis Season-by-Season</div>' +
          '<div class="coach-table-wrap">' +
            '<table class="coach-table">' +
              '<thead><tr><th>Season</th><th class="num">Record</th><th class="num">Pct / Pts</th><th>Result</th></tr></thead>' +
              '<tbody>' + seasonRows + '</tbody>' +
              '<tfoot><tr><td>STL Total</td><td class="num">' + esc((c.seasonTotal && c.seasonTotal.record) || c.headlineRecord) + '</td><td class="num">' + esc((c.seasonTotal && c.seasonTotal.rate) || '—') + '</td><td>' + esc((c.seasonTotal && c.seasonTotal.finish) || '') + '</td></tr></tfoot>' +
            '</table>' +
          '</div>' +

          '<div class="coach-subhead">Career Ledger</div>' +
          careerRows +

          '<div class="coach-subhead">Honors &amp; Milestones</div>' +
          '<div class="coach-honors">' + honorItems + '</div>' +

          '<div class="links">' + linksHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  var grid = document.getElementById('coachesGrid');
  var expandBtn = document.getElementById('expandAllBtn');
  var syncBtn = document.getElementById('syncBtn');
  var subEl = document.getElementById('coachesSub');
  var footNoteEl = document.getElementById('syncFootNote');

  function syncExpandBtn() {
    var cards = grid.querySelectorAll('.teamcard');
    if (!cards.length) return;
    var allOpen = Array.prototype.every.call(cards, function(el) { return el.classList.contains('open'); });
    expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
  }

  function renderAll(payload) {
    currentCoaches = (payload && payload.coaches) || [];
    if (!currentCoaches.length) return;
    grid.innerHTML = currentCoaches.map(renderCoachCard).join('');
    syncExpandBtn();

    var ts = payload.checked_at || payload.generated_at;
    if (ts) {
      var d = new Date(ts);
      if (isFinite(d)) {
        var timeLabel = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        var dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        subEl.textContent = 'ST. LOUIS BENCH BOSSES \u00B7 SYNCED ' + dateLabel.toUpperCase() + ' ' + timeLabel.toUpperCase();
        footNoteEl.textContent = 'Auto-synced with ESPN, MLB Stats API & Wikipedia (' + dateLabel + ', ' + timeLabel + ')';
      }
    }
  }

  function normName(name) {
    return String(name || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function cleanWikiValue(raw) {
    if (!raw) return '';
    var s = String(raw)
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '')
      .replace(/<ref[^>]*\/>/gi, '')
      .replace(/<br\s*\/?>/gi, ', ')
      .replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, '$1')
      .replace(/\{\{[^{}]*\}\}/g, '')
      .replace(/'''?/g, '')
      .replace(/\s+/g, ' ')
      .replace(/^[,;\s]+|[,;\s]+$/g, '')
      .trim();
    return /^(vacant|tbd|tba|none|n\/a|-+|—+)$/i.test(s) ? '' : s;
  }

  function parseInfoboxField(wt, fields) {
    if (!wt) return { value: '', linkTitle: '' };
    for (var i = 0; i < fields.length; i++) {
      var re = new RegExp('^\\|\\s*' + fields[i] + '\\s*=\\s*(.+)$', 'im');
      var m = wt.match(re);
      if (!m) continue;
      var raw = m[1].split(/\n\|/)[0].trim();
      var lm = raw.match(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/);
      var val = cleanWikiValue(raw);
      if (val) return { value: val, linkTitle: lm ? lm[1].trim() : '' };
    }
    return { value: '', linkTitle: '' };
  }

  // Fallback live browser verification when /api/coaches is not available (e.g. static hosting)
  async function directBrowserVerify(basePayload) {
    var coaches = (basePayload && basePayload.coaches) ? basePayload.coaches.slice() : [];
    if (!coaches.length) return basePayload;

    var updated = await Promise.all(coaches.map(async function(coach) {
      var src = coach.sources || {};
      var detected = null;
      var srcLabel = '';

      if (src.mlbCoaches) {
        try {
          var r = await STL.shared.fetchWithTimeout(src.mlbCoaches, 5000);
          if (r.ok) {
            var md = await r.json();
            var mgr = (md.roster || []).find(function(x) { return x.jobId === 'MNGR' || /^manager$/i.test(x.job || ''); });
            if (mgr && mgr.person && mgr.person.fullName) {
              detected = { name: mgr.person.fullName.trim(), linkTitle: '' };
              srcLabel = 'MLB Stats API';
            }
          }
        } catch (e) {}
      }

      if (!detected && src.espnRoster) {
        try {
          var r2 = await STL.shared.fetchWithTimeout(src.espnRoster, 5000);
          if (r2.ok) {
            var ed = await r2.json();
            var c0 = Array.isArray(ed.coach) ? ed.coach[0] : null;
            if (c0 && (c0.firstName || c0.lastName)) {
              detected = { name: [c0.firstName, c0.lastName].filter(Boolean).join(' ').trim(), linkTitle: '' };
              srcLabel = 'ESPN Roster API';
            }
          }
        } catch (e) {}
      }

      if (!detected && src.wikiTitle) {
        try {
          var wUrl = 'https://en.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(src.wikiTitle) +
            '&redirects=1&prop=revisions&rvprop=content&rvslots=main&rvsection=0&format=json&origin=*';
          var r3 = await STL.shared.fetchWithTimeout(wUrl, 5000);
          if (r3.ok) {
            var wd = await r3.json();
            var pages = Object.values((wd.query && wd.query.pages) || {});
            var wt = pages[0] && pages[0].revisions && pages[0].revisions[0] && pages[0].revisions[0].slots && pages[0].revisions[0].slots.main['*'];
            var parsed = parseInfoboxField(wt, src.wikiFields || ['coach', 'head_coach', 'manager']);
            if (parsed.value) {
              detected = parsed;
              srcLabel = 'Wikipedia';
            }
          }
        } catch (e) {}
      }

      if (detected) {
        var known = [coach.name].concat(coach.aliases || []).map(normName);
        if (known.indexOf(normName(detected.name)) === -1) {
          var todayIso = new Date().toISOString().slice(0, 10);
          var todayDisp = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          var bio = detected.name + ' was detected via ' + srcLabel + ' as the ' + coach.role.toLowerCase() + ' of the ' + coach.team + '.';
          try {
            var sumR = await STL.shared.fetchWithTimeout(
              'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent((detected.linkTitle || detected.name).replace(/\s+/g, '_')),
              4500
            );
            if (sumR.ok) {
              var sd = await sumR.json();
              if (sd.extract) bio = sd.extract.split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
            }
          } catch (e) {}
          var parts = detected.name.trim().split(/\s+/);
          var initials = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : detected.name.slice(0, 2).toUpperCase();
          return Object.assign({}, coach, {
            initials: initials,
            name: detected.name,
            aliases: [detected.name],
            hiredDate: todayIso,
            hiredDisplay: todayDisp,
            franchiseNumber: 'Appointed ' + todayDisp + ' (auto-detected via ' + srcLabel + ')',
            birthDate: '',
            birthPlace: '—',
            almaMater: '—',
            contractNote: 'Replaces ' + coach.name + ' · Detected via ' + srcLabel,
            headlineRecord: '0–0',
            headlineLabel: 'CURRENT TENURE',
            rateValue: 'New Hire',
            rateSub: 'Newly appointed',
            postseasonValue: '—',
            postseasonSub: 'First season in STL',
            highlightTag: 'New Coach Detected',
            autoUpdated: true,
            detectedSource: srcLabel,
            previousCoach: { name: coach.name, record: coach.headlineRecord, hiredDisplay: coach.hiredDisplay },
            bio: bio,
            seasons: [{ season: 'Current', record: '0–0', rate: '—', finish: 'Active tenure', live: true }],
            seasonTotal: { record: '0–0', rate: '—', finish: 'New coaching tenure' },
            careerRows: [{ label: 'Prior Tenure', value: 'Succeeded ' + coach.name + ' (' + coach.headlineRecord + ')' }],
            honors: ['Auto-updated from ' + srcLabel + ' upon coaching change detection']
          });
        }
      }
      return coach;
    }));

    return {
      generated_at: basePayload.generated_at,
      checked_at: new Date().toISOString(),
      coaches: updated
    };
  }

  async function loadCoaches(forceRefresh) {
    if (syncBtn) {
      syncBtn.disabled = true;
      syncBtn.textContent = 'Syncing…';
    }

    var cached = !forceRefresh ? STL.shared.readCache(CACHE_KEY) : null;
    if (cached && cached.coaches && cached.coaches.length) {
      renderAll(cached);
    }

    // Fast same-origin baseline paint from Sports/data/coaches.json if cache missed
    var basePayload = cached;
    if (!basePayload) {
      try {
        var jsonResp = await STL.shared.fetchWithTimeout('data/coaches.json', 5000, { cache: 'no-store' });
        if (jsonResp.ok) {
          basePayload = await jsonResp.json();
          renderAll(basePayload);
        }
      } catch (e) {}
    }

    // Live check via server /api/coaches first, falling back to direct CORS check
    try {
      var apiUrl = '/api/coaches' + (forceRefresh ? '?refresh=1' : '');
      var apiResp = await STL.shared.fetchWithTimeout(apiUrl, 8000, { cache: 'no-store' });
      if (apiResp.ok) {
        var livePayload = await apiResp.json();
        if (livePayload && livePayload.coaches && livePayload.coaches.length) {
          STL.shared.writeCache(CACHE_KEY, livePayload, CACHE_TTL);
          renderAll(livePayload);
          return;
        }
      }
      throw new Error('api unavailable');
    } catch (e) {
      if (basePayload) {
        try {
          var directPayload = await directBrowserVerify(basePayload);
          STL.shared.writeCache(CACHE_KEY, directPayload, CACHE_TTL);
          renderAll(directPayload);
        } catch (e2) {}
      }
    } finally {
      if (syncBtn) {
        syncBtn.disabled = false;
        syncBtn.textContent = 'Sync';
      }
    }
  }

  grid.addEventListener('click', function(e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-toggle-coach]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-toggle-coach');
    var card = btn.closest('.teamcard');
    if (!card) return;
    var open = card.classList.toggle('open');
    openState[id] = open;
    btn.textContent = open ? '\u2013 close' : '+ details';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    syncExpandBtn();
  });

  expandBtn.addEventListener('click', function() {
    var cards = grid.querySelectorAll('.teamcard');
    var allOpen = Array.prototype.every.call(cards, function(el) { return el.classList.contains('open'); });
    Array.prototype.forEach.call(cards, function(card) {
      var open = !allOpen;
      var id = card.getAttribute('data-coach');
      openState[id] = open;
      card.classList.toggle('open', open);
      var btn = card.querySelector('[data-toggle-coach]');
      if (btn) {
        btn.textContent = open ? '\u2013 close' : '+ details';
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
    });
    syncExpandBtn();
  });

  syncBtn.addEventListener('click', function() {
    loadCoaches(true);
  });

  loadCoaches(false);
})();
</script>
</body>
</html>
