<style>
#app { width: 100%; }

.coaches-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.coaches-head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.expand-all-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--page-ink);
  padding: 5px 13px;
  min-height: 36px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.16s, transform 0.1s ease;
}
.expand-all-btn:hover { background: rgba(var(--ink-rgb), 0.06); }
.expand-all-btn:active { transform: scale(0.96); }
.expand-all-btn:disabled { opacity: 0.55; cursor: wait; }

.coach-head-main {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.coach-avatar {
  width: 46px;
  height: 46px;
  border-radius: 11px;
  background: var(--team, var(--hero));
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14), inset 0 0 0 1.5px var(--team, var(--hero));
}

.coach-photo {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center 20%;
}

.coach-mono {
  width: 100%;
  height: 100%;
  background: var(--team, var(--hero));
  color: #fff;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.96rem;
  letter-spacing: 0.5px;
  display: none;
  align-items: center;
  justify-content: center;
}

.coach-avatar.is-fallback .coach-photo { display: none; }
.coach-avatar.is-fallback .coach-mono { display: flex; }

html[data-theme="dark"] .team-blues .coach-mono {
  color: #171114;
}

.coach-title-wrap { min-width: 0; }

.coach-record-wrap {
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.coach-record-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin-top: 1px;
}

.coach-change-banner {
  margin-top: 10px;
  padding: 7px 10px;
  border-radius: 9px;
  background: rgba(var(--ink-rgb), 0.05);
  border-left: 3px solid var(--team, var(--accent));
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--card-ink);
}

.coach-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 11px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(var(--ink-rgb), 0.04);
  border: 1px solid rgba(var(--ink-rgb), 0.07);
}

.coach-metric-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--card-mute);
}

.coach-metric-val {
  font-family: var(--mono);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--card-ink);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.coach-metric-sub {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--card-mute);
  margin-top: 1px;
}

.coach-summary {
  margin-top: 10px;
  font-size: 0.84rem;
  line-height: 1.52;
  color: var(--card-ink);
}

.coach-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
}

.coach-note-tag {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--team, var(--accent));
  font-weight: 700;
}

.coach-subhead {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin: 14px 0 6px;
}

.coach-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(var(--ink-rgb), 0.025);
}

.coach-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 0.75rem;
}

.coach-table th {
  text-align: left;
  padding: 7px 9px;
  font-size: 0.62rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--card-mute);
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}

.coach-table td {
  padding: 6px 9px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.06);
  color: var(--card-ink);
  font-variant-numeric: tabular-nums;
}

.coach-table td:first-child,
.coach-table th.num,
.coach-table td.num {
  white-space: nowrap;
}
.coach-table th.num,
.coach-table td.num {
  text-align: right;
}

.coach-table tbody tr:last-child td { border-bottom: none; }

.coach-table tfoot td {
  font-weight: 700;
  border-top: 1px solid var(--line);
  background: rgba(var(--ink-rgb), 0.04);
}

.coach-live-pill {
  display: inline-block;
  font-size: 0.58rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #1c7a35;
  font-weight: 700;
  margin-left: 4px;
}

html[data-theme="dark"] .coach-live-pill { color: var(--live-accent); }

.coach-honors {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 4px;
}

.coach-honor-item {
  font-size: 0.79rem;
  line-height: 1.45;
  color: var(--card-ink);
  padding-left: 11px;
  position: relative;
}

.coach-honor-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--team, var(--accent));
}

.loading {
  text-align: center;
  color: var(--card-mute);
  padding: 40px;
  font-size: 0.9rem;
}

.team-rams { --team: #003594; }
.team-browns { --team: #b45309; }
html[data-theme="dark"] .team-rams { --team: #7baaf7; }
html[data-theme="dark"] .team-browns { --team: #e08b4c; }

.lb-card {
  background: var(--card);
  color: var(--card-ink);
  border-radius: 14px;
  border: 1px solid rgba(var(--ink-rgb), 0.1);
  box-shadow: 0 3px 12px rgba(var(--ink-rgb), 0.1);
  padding: 16px 18px;
  margin-bottom: 14px;
}

.lb-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.lb-title {
  font-family: var(--serif);
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--card-ink);
  line-height: 1.2;
}

.lb-sub {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin-top: 3px;
}

.lb-tabs {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: rgba(var(--ink-rgb), 0.03);
}

.lb-tab {
  background: none;
  border: none;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  color: var(--card-mute);
  padding: 6px 13px;
  min-height: 34px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.1s ease;
}
.lb-tab + .lb-tab { border-left: 1px solid var(--line); }
.lb-tab:hover { color: var(--card-ink); background: rgba(var(--ink-rgb), 0.05); }
.lb-tab:active { transform: scale(0.96); }
.lb-tab.active {
  background: var(--card-ink);
  color: var(--card);
  font-weight: 700;
}

.lb-list {
  display: flex;
  flex-direction: column;
  margin-top: 4px;
}

.lb-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px 12px;
  padding: 10px 6px;
  border-bottom: 1px solid rgba(var(--ink-rgb), 0.07);
}
.lb-row:last-child { border-bottom: none; }
.lb-row.is-live {
  background: rgba(var(--ink-rgb), 0.035);
  border-radius: 8px;
  margin: 2px -6px;
  padding-left: 12px;
  padding-right: 12px;
  border-bottom-color: transparent;
}

.lb-rank {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--card-mute);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.lb-row.is-top3 .lb-rank {
  color: var(--team, var(--accent));
}

.lb-info { min-width: 0; }

.lb-name-line {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.lb-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--team, var(--accent));
  flex-shrink: 0;
}

.lb-name {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--card-ink);
}

.lb-meta {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--card-mute);
  margin-top: 2px;
  line-height: 1.35;
}

.lb-bar-track {
  margin-top: 6px;
  height: 4px;
  width: 100%;
  border-radius: 999px;
  background: rgba(var(--ink-rgb), 0.08);
  overflow: hidden;
}

.lb-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--team, var(--accent));
  min-width: 3px;
}

.lb-days {
  font-family: var(--mono);
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--card-ink);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.lb-days-unit {
  display: block;
  font-size: 0.58rem;
  font-weight: 400;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--card-mute);
  margin-top: 1px;
}

@media (pointer: coarse) {
  .expand-all-btn { min-height: 40px; padding: 6px 14px; }
  .lb-tab { min-height: 40px; padding: 6px 15px; }
}

@media (max-width: 540px) {
  .coach-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .coach-metrics > :last-child { grid-column: 1 / -1; }
  .trow1 { flex-wrap: wrap; }
  .coach-record-wrap { margin-left: 57px; text-align: left; }
  .lb-card { padding: 14px; }
  .lb-row { grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px 10px; }
  .lb-days { font-size: 0.82rem; }
}
</style>

<script>
(function() {
  var esc = STL.utils.escHtml;
  var CACHE_KEY = 'stl_coaches_v2';
  var CACHE_TTL = 10 * 60 * 1000;
  var openState = {};
  var currentCoaches = [];
  var lbMode = 'all';

  var HISTORICAL_TENURES = [
    { name: 'Tony La Russa', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1995-10-23', end: '2011-10-31', note: 'Oct 23, 1995 – Oct 31, 2011' },

    { name: 'Whitey Herzog', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1980-06-08', end: '1990-07-06', note: 'Jun 8, 1980 – Jul 6, 1990' },

    { name: 'Mike Matheny', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '2011-11-14', end: '2018-07-14', note: 'Nov 14, 2011 – Jul 14, 2018' },
    { name: 'Mike Martz', team: 'St. Louis Rams', league: 'NFL', teamClass: 'team-rams', start: '2000-02-02', end: '2006-01-02', note: 'Feb 2, 2000 – Jan 2, 2006' },
    { name: 'Jim Hanifan', team: 'St. Louis Cardinals', league: 'NFL', teamClass: 'team-cardinals', start: '1980-01-30', end: '1985-12-21', note: 'Jan 30, 1980 – Dec 21, 1985' },
    { name: 'Billy Southworth', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1940-06-14', end: '1945-11-06', note: 'Jun 14, 1940 – Nov 6, 1945' },
    { name: 'Ken Hitchcock', team: 'St. Louis Blues', league: 'NHL', teamClass: 'team-blues', start: '2011-11-06', end: '2017-02-01', note: 'Nov 6, 2011 – Feb 1, 2017' },
    { name: 'Luke Sewell', team: 'St. Louis Browns', league: 'MLB', teamClass: 'team-browns', start: '1941-06-05', end: '1946-08-31', note: 'Jun 5, 1941 – Aug 31, 1946' },
    { name: 'Frankie Frisch', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1933-07-25', end: '1938-09-11', note: 'Jul 25, 1933 – Sep 11, 1938' },

    { name: 'Eddie Dyer', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1945-11-06', end: '1950-10-16', note: 'Nov 6, 1945 – Oct 16, 1950' },
    { name: 'Charley Winner', team: 'St. Louis Cardinals', league: 'NFL', teamClass: 'team-cardinals', start: '1966-02-10', end: '1971-01-06', note: 'Feb 10, 1966 – Jan 6, 1971' },
    { name: 'Joe Torre', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '1990-08-01', end: '1995-06-16', note: 'Aug 1, 1990 – Jun 16, 1995' },

    { name: 'Mike Shildt', team: 'St. Louis Cardinals', league: 'MLB', teamClass: 'team-cardinals', start: '2018-07-14', end: '2021-10-14', note: 'Jul 14, 2018 – Oct 14, 2021' },
    { name: 'Andy Murray', team: 'St. Louis Blues', league: 'NHL', teamClass: 'team-blues', start: '2006-12-11', end: '2010-01-02', note: 'Dec 11, 2006 – Jan 2, 2010' },
    { name: 'Bradley Carnell', team: 'St. Louis CITY SC', league: 'MLS', teamClass: 'team-city-sc', start: '2022-01-05', end: '2024-07-01', note: 'Jan 5, 2022 – Jul 1, 2024' }
  ];

  function calcTenure(isoDate) {
    if (!isoDate || !/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) {
      return { short: 'Recent', detail: 'Recently appointed', days: 0 };
    }
    var parts = isoDate.split('-').map(Number);
    var start = new Date(parts[0], parts[1] - 1, parts[2]);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (!isFinite(start) || today < start) return { short: '0 mos', detail: 'Upcoming', days: 0 };

    var years = today.getFullYear() - start.getFullYear();
    var months = today.getMonth() - start.getMonth();
    var days = today.getDate() - start.getDate();

    if (days < 0) {
      months -= 1;
      var prevMonthDays = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      days += prevMonthDays;
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }

    var totalDays = Math.round((today - start) / 86400000);
    var bits = [];
    if (years > 0) bits.push(years + (years === 1 ? ' yr' : ' yrs'));
    if (months > 0 || years === 0) bits.push(months + (months === 1 ? ' mo' : ' mos'));
    return {
      short: bits.join(', '),
      detail: bits.join(', ') + ' (' + totalDays.toLocaleString('en-US') + ' days)',
      days: totalDays
    };
  }

  function calcAge(birthIso) {
    if (!birthIso || !/^\d{4}-\d{2}-\d{2}$/.test(birthIso)) return null;
    var parts = birthIso.split('-').map(Number);
    var now = new Date();
    var age = now.getFullYear() - parts[0];
    var m = (now.getMonth() + 1) - parts[1];
    if (m < 0 || (m === 0 && now.getDate() < parts[2])) age -= 1;
    return age;
  }

  function fmtBirthDate(birthIso) {
    if (!birthIso || !/^\d{4}-\d{2}-\d{2}$/.test(birthIso)) return '';
    var parts = birthIso.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderCoachCard(c) {
    var tenure = calcTenure(c.hiredDate);
    var age = calcAge(c.birthDate);
    var ageText = age != null ? (age + ' (' + fmtBirthDate(c.birthDate) + ')') : '—';
    var isOpen = !!openState[c.id];

    var seasonRows = (c.seasons || []).map(function(s) {
      return '<tr>' +
        '<td>' + esc(s.season) + (s.live ? '<span class="coach-live-pill">Active</span>' : '') + '</td>' +
        '<td class="num">' + esc(s.record) + '</td>' +
        '<td class="num">' + esc(s.rate) + '</td>' +
        '<td>' + esc(s.finish) + '</td>' +
      '</tr>';
    }).join('');

    var careerRows = (c.careerRows || []).map(function(r) {
      return '<div class="stat-row">' +
        '<span class="stat-label">' + esc(r.label) + '</span>' +
        '<span class="stat-value">' + esc(r.value) + '</span>' +
      '</div>';
    }).join('');

    var honorItems = (c.honors || []).map(function(h) {
      return '<div class="coach-honor-item">' + esc(h) + '</div>';
    }).join('');

    var linksHtml = (c.links || []).map(function(l) {
      var ext = l.href.indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '';
      return '<a href="' + esc(l.href) + '"' + ext + '>' + esc(l.text) + ' &rarr;</a>';
    }).join('');

    var changeBanner = c.autoUpdated && c.previousCoach
      ? '<div class="coach-change-banner">Coaching change auto-detected via ' + esc(c.detectedSource || 'live feed') + ' &middot; Succeeds ' + esc(c.previousCoach.name) + ' (' + esc(c.previousCoach.record) + ')</div>'
      : '';

    var avatarHtml = '<div class="coach-avatar' + (c.headshot ? '' : ' is-fallback') + '">' +
      (c.headshot
        ? '<img class="coach-photo" src="' + esc(c.headshot) + '" alt="' + esc(c.name) + ' headshot" loading="lazy" referrerpolicy="no-referrer">'
        : '') +
      '<div class="coach-mono" aria-hidden="true">' + esc(c.initials) + '</div>' +
    '</div>';

    return '<article class="teamcard ' + esc(c.teamClass) + (isOpen ? ' open' : '') + '" data-coach="' + esc(c.id) + '">' +
      '<div class="tmain">' +
        '<div class="trow1">' +
          '<div class="coach-head-main">' +
            avatarHtml +
            '<div class="coach-title-wrap">' +
              '<div class="tname">' + esc(c.name) + '</div>' +
              '<div class="tleague">' + esc(c.team) + ' &middot; ' + esc(c.league) + ' ' + esc(c.role) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="coach-record-wrap">' +
            '<div class="trecord" id="rec-' + esc(c.id) + '">' + esc(c.headlineRecord) + '</div>' +
            '<div class="coach-record-label">' + esc(c.headlineLabel) + '</div>' +
          '</div>' +
        '</div>' +

        changeBanner +

        '<div class="coach-metrics">' +
          '<div>' +
            '<div class="coach-metric-label">Tenure</div>' +
            '<div class="coach-metric-val">' + esc(tenure.short) + '</div>' +
            '<div class="coach-metric-sub">Hired ' + esc(c.hiredDisplay) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="coach-metric-label">Pace / Pct</div>' +
            '<div class="coach-metric-val">' + esc(c.rateValue) + '</div>' +
            '<div class="coach-metric-sub">' + esc(c.rateSub) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="coach-metric-label">Postseason / Hardware</div>' +
            '<div class="coach-metric-val">' + esc(c.postseasonValue) + '</div>' +
            '<div class="coach-metric-sub">' + esc(c.postseasonSub) + '</div>' +
          '</div>' +
        '</div>' +

        '<p class="coach-summary">' + esc(c.bio) + '</p>' +

        '<div class="coach-actions">' +
          '<button class="details-btn" type="button" data-toggle-coach="' + esc(c.id) + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' + (isOpen ? '\u2013 close' : '+ details') + '</button>' +
          '<span class="coach-note-tag">' + esc(c.highlightTag) + '</span>' +
        '</div>' +

        '<div class="tbody">' +
          '<div class="coach-subhead">Profile &amp; Tenure</div>' +
          '<div class="stat-row"><span class="stat-label">Appointment</span><span class="stat-value">' + esc(c.hiredDisplay) + ' &middot; ' + esc(c.franchiseNumber) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Tenure Length</span><span class="stat-value">' + esc(tenure.detail) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Age &amp; Born</span><span class="stat-value">' + esc(ageText) + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Birthplace</span><span class="stat-value">' + esc(c.birthPlace || '—') + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Alma Mater</span><span class="stat-value">' + esc(c.almaMater || '—') + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">Status</span><span class="stat-value">' + esc(c.contractNote || '—') + '</span></div>' +

          '<div class="coach-subhead">St. Louis Season-by-Season</div>' +
          '<div class="coach-table-wrap">' +
            '<table class="coach-table">' +
              '<thead><tr><th>Season</th><th class="num">Record</th><th class="num">Pct / Pts</th><th>Result</th></tr></thead>' +
              '<tbody>' + seasonRows + '</tbody>' +
              '<tfoot><tr><td>STL Total</td><td class="num">' + esc((c.seasonTotal && c.seasonTotal.record) || c.headlineRecord) + '</td><td class="num">' + esc((c.seasonTotal && c.seasonTotal.rate) || '—') + '</td><td>' + esc((c.seasonTotal && c.seasonTotal.finish) || '') + '</td></tr></tfoot>' +
            '</table>' +
          '</div>' +

          '<div class="coach-subhead">Career Ledger</div>' +
          careerRows +

          '<div class="coach-subhead">Honors &amp; Milestones</div>' +
          '<div class="coach-honors">' + honorItems + '</div>' +

          '<div class="links">' + linksHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  var grid = document.getElementById('coachesGrid');
  var lbEl = document.getElementById('tenureLeaderboard');
  var expandBtn = document.getElementById('expandAllBtn');
  var syncBtn = document.getElementById('syncBtn');
  var subEl = document.getElementById('coachesSub');
  var footNoteEl = document.getElementById('syncFootNote');

  function diffIsoDays(startIso, endIso) {
    var s = startIso.split('-').map(Number);
    var e = endIso.split('-').map(Number);
    var d1 = new Date(s[0], s[1] - 1, s[2]);
    var d2 = new Date(e[0], e[1] - 1, e[2]);
    return Math.max(0, Math.round((d2 - d1) / 86400000));
  }

  function renderLeaderboard() {
    if (!lbEl) return;
    var activeRows = (currentCoaches || []).map(function(c) {
      var t = calcTenure(c.hiredDate);
      return {
        name: c.name,
        team: c.team,
        league: c.league,
        teamClass: c.teamClass || '',
        days: t.days,
        note: 'Since ' + (c.hiredDisplay || c.hiredDate || 'Recently'),
        live: true
      };
    });

    var rows;
    if (lbMode === 'active') {
      rows = activeRows;
    } else {
      var histRows = HISTORICAL_TENURES.map(function(h) {
        return {
          name: h.name,
          team: h.team,
          league: h.league,
          teamClass: h.teamClass,
          days: diffIsoDays(h.start, h.end),
          note: h.note,
          live: false
        };
      });
      rows = histRows.concat(activeRows);
    }

    rows.sort(function(a, b) {
      if (b.days !== a.days) return b.days - a.days;
      return a.name.localeCompare(b.name);
    });

    var maxDays = rows.length ? Math.max(rows[0].days, 1) : 1;
    var rowsHtml = rows.map(function(r, idx) {
      var pct = Math.max(2, Math.round((r.days / maxDays) * 100));
      var cls = 'lb-row ' + esc(r.teamClass) + (r.live ? ' is-live' : '') + (idx < 3 ? ' is-top3' : '');
      return '<div class="' + cls + '">' +
        '<div class="lb-rank">' + (idx + 1) + '</div>' +
        '<div class="lb-info">' +
          '<div class="lb-name-line">' +
            '<span class="lb-dot" aria-hidden="true"></span>' +
            '<span class="lb-name">' + esc(r.name) + '</span>' +
            (r.live ? '<span class="coach-live-pill">Active</span>' : '') +
          '</div>' +
          '<div class="lb-meta">' + esc(r.team) + ' &middot; ' + esc(r.league) + ' &middot; ' + esc(r.note) + '</div>' +
          '<div class="lb-bar-track"><div class="lb-bar-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="lb-days">' + r.days.toLocaleString('en-US') + '<span class="lb-days-unit">days</span></div>' +
      '</div>';
    }).join('');

    lbEl.innerHTML =
      '<div class="lb-head">' +
        '<div>' +
          '<h2 class="lb-title">Longest Tenured St. Louis Coaches</h2>' +
          '<div class="lb-sub">Units: Days &middot; Active tenures update daily</div>' +
        '</div>' +
        '<div class="lb-tabs" role="tablist" aria-label="Leaderboard filter">' +
          '<button class="lb-tab' + (lbMode === 'all' ? ' active' : '') + '" type="button" data-lb-mode="all" role="tab" aria-selected="' + (lbMode === 'all' ? 'true' : 'false') + '">All-Time</button>' +
          '<button class="lb-tab' + (lbMode === 'active' ? ' active' : '') + '" type="button" data-lb-mode="active" role="tab" aria-selected="' + (lbMode === 'active' ? 'true' : 'false') + '">Active (' + activeRows.length + ')</button>' +
        '</div>' +
      '</div>' +
      '<div class="lb-list">' + rowsHtml + '</div>';
  }

  function syncExpandBtn() {
    var cards = grid.querySelectorAll('.teamcard');
    if (!cards.length) return;
    var allOpen = Array.prototype.every.call(cards, function(el) { return el.classList.contains('open'); });
    expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
  }

  function renderAll(payload) {
    currentCoaches = (payload && payload.coaches) || [];
    if (!currentCoaches.length) return;
    grid.innerHTML = currentCoaches.map(renderCoachCard).join('');
    syncExpandBtn();
    renderLeaderboard();

    var ts = payload.checked_at || payload.generated_at;
    if (ts) {
      var d = new Date(ts);
      if (isFinite(d)) {
        var timeLabel = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        var dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        subEl.textContent = 'ST. LOUIS BENCH BOSSES \u00B7 SYNCED ' + dateLabel.toUpperCase() + ' ' + timeLabel.toUpperCase();
        footNoteEl.textContent = 'Auto-synced with ESPN, MLB Stats API & Wikipedia (' + dateLabel + ', ' + timeLabel + ')';
      }
    }
  }

  function normName(name) {
    return String(name || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function cleanWikiValue(raw) {
    if (!raw) return '';
    var s = String(raw)
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '')
      .replace(/<ref[^>]*\/>/gi, '')
      .replace(/<br\s*\/?>/gi, ', ')
      .replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, '$1')
      .replace(/\{\{[^{}]*\}\}/g, '')
      .replace(/'''?/g, '')
      .replace(/\s+/g, ' ')
      .replace(/^[,;\s]+|[,;\s]+$/g, '')
      .trim();
    return /^(vacant|tbd|tba|none|n\/a|-+|—+)$/i.test(s) ? '' : s;
  }

  function parseInfoboxField(wt, fields) {
    if (!wt) return { value: '', linkTitle: '' };
    for (var i = 0; i < fields.length; i++) {
      var re = new RegExp('^\\|\\s*' + fields[i] + '\\s*=\\s*(.+)$', 'im');
      var m = wt.match(re);
      if (!m) continue;
      var raw = m[1].split(/\n\|/)[0].trim();
      var lm = raw.match(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/);
      var val = cleanWikiValue(raw);
      if (val) return { value: val, linkTitle: lm ? lm[1].trim() : '' };
    }
    return { value: '', linkTitle: '' };
  }

  // Fallback live browser verification when /api/coaches is not available (e.g. static hosting)
  async function directBrowserVerify(basePayload) {
    var coaches = (basePayload && basePayload.coaches) ? basePayload.coaches.slice() : [];
    if (!coaches.length) return basePayload;

    var updated = await Promise.all(coaches.map(async function(coach) {
      var src = coach.sources || {};
      var detected = null;
      var srcLabel = '';

      if (src.mlbCoaches) {
        try {
          var r = await STL.shared.fetchWithTimeout(src.mlbCoaches, 5000);
          if (r.ok) {
            var md = await r.json();
            var mgr = (md.roster || []).find(function(x) { return x.jobId === 'MNGR' || /^manager$/i.test(x.job || ''); });
            if (mgr && mgr.person && mgr.person.fullName) {
              detected = { name: mgr.person.fullName.trim(), linkTitle: '' };
              srcLabel = 'MLB Stats API';
            }
          }
        } catch (e) {}
      }

      if (!detected && src.espnRoster) {
        try {
          var r2 = await STL.shared.fetchWithTimeout(src.espnRoster, 5000);
          if (r2.ok) {
            var ed = await r2.json();
            var c0 = Array.isArray(ed.coach) ? ed.coach[0] : null;
            if (c0 && (c0.firstName || c0.lastName)) {
              detected = { name: [c0.firstName, c0.lastName].filter(Boolean).join(' ').trim(), linkTitle: '' };
              srcLabel = 'ESPN Roster API';
            }
          }
        } catch (e) {}
      }

      if (!detected && src.wikiTitle) {
        try {
          var wUrl = 'https://en.wikipedia.org/w/api.php?action=query&titles=' + encodeURIComponent(src.wikiTitle) +
            '&redirects=1&prop=revisions&rvprop=content&rvslots=main&rvsection=0&format=json&origin=*';
          var r3 = await STL.shared.fetchWithTimeout(wUrl, 5000);
          if (r3.ok) {
            var wd = await r3.json();
            var pages = Object.values((wd.query && wd.query.pages) || {});
            var wt = pages[0] && pages[0].revisions && pages[0].revisions[0] && pages[0].revisions[0].slots && pages[0].revisions[0].slots.main['*'];
            var parsed = parseInfoboxField(wt, src.wikiFields || ['coach', 'head_coach', 'manager']);
            if (parsed.value) {
              detected = parsed;
              srcLabel = 'Wikipedia';
            }
          }
        } catch (e) {}
      }

      if (detected) {
        var known = [coach.name].concat(coach.aliases || []).map(normName);
        if (known.indexOf(normName(detected.name)) === -1) {
          var todayIso = new Date().toISOString().slice(0, 10);
          var todayDisp = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          var bio = detected.name + ' was detected via ' + srcLabel + ' as the ' + coach.role.toLowerCase() + ' of the ' + coach.team + '.';
          var headshot = '';
          try {
            var sumR = await STL.shared.fetchWithTimeout(
              'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent((detected.linkTitle || detected.name).replace(/\s+/g, '_')),
              4500
            );
            if (sumR.ok) {
              var sd = await sumR.json();
              if (sd.extract) bio = sd.extract.split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
              var rawImg = (sd.thumbnail && sd.thumbnail.source) || (sd.originalimage && sd.originalimage.source) || '';
              if (rawImg) headshot = rawImg.split('?')[0];
            }
          } catch (e) {}
          var parts = detected.name.trim().split(/\s+/);
          var initials = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase() : detected.name.slice(0, 2).toUpperCase();
          return Object.assign({}, coach, {
            initials: initials,
            headshot: headshot,
            name: detected.name,
            aliases: [detected.name],
            hiredDate: todayIso,
            hiredDisplay: todayDisp,
            franchiseNumber: 'Appointed ' + todayDisp + ' (auto-detected via ' + srcLabel + ')',
            birthDate: '',
            birthPlace: '—',
            almaMater: '—',
            contractNote: 'Replaces ' + coach.name + ' · Detected via ' + srcLabel,
            headlineRecord: '0–0',
            headlineLabel: 'CURRENT TENURE',
            rateValue: 'New Hire',
            rateSub: 'Newly appointed',
            postseasonValue: '—',
            postseasonSub: 'First season in STL',
            highlightTag: 'New Coach Detected',
            autoUpdated: true,
            detectedSource: srcLabel,
            previousCoach: { name: coach.name, record: coach.headlineRecord, hiredDisplay: coach.hiredDisplay },
            bio: bio,
            seasons: [{ season: 'Current', record: '0–0', rate: '—', finish: 'Active tenure', live: true }],
            seasonTotal: { record: '0–0', rate: '—', finish: 'New coaching tenure' },
            careerRows: [{ label: 'Prior Tenure', value: 'Succeeded ' + coach.name + ' (' + coach.headlineRecord + ')' }],
            honors: ['Auto-updated from ' + srcLabel + ' upon coaching change detection']
          });
        }
      }
      return coach;
    }));

    return {
      generated_at: basePayload.generated_at,
      checked_at: new Date().toISOString(),
      coaches: updated
    };
  }

  async function loadCoaches(forceRefresh) {
    if (syncBtn) {
      syncBtn.disabled = true;
      syncBtn.textContent = 'Syncing…';
    }

    var cached = !forceRefresh ? STL.shared.readCache(CACHE_KEY) : null;
    if (cached && cached.coaches && cached.coaches.length) {
      renderAll(cached);
    }

    // Fast same-origin baseline paint from Sports/data/coaches.json if cache missed
    var basePayload = cached;
    if (!basePayload) {
      try {
        var jsonResp = await STL.shared.fetchWithTimeout('data/coaches.json', 5000, { cache: 'no-store' });
        if (jsonResp.ok) {
          basePayload = await jsonResp.json();
          renderAll(basePayload);
        }
      } catch (e) {}
    }

    // Live check via server /api/coaches first, falling back to direct CORS check
    try {
      var apiUrl = '/api/coaches' + (forceRefresh ? '?refresh=1' : '');
      var apiResp = await STL.shared.fetchWithTimeout(apiUrl, 8000, { cache: 'no-store' });
      if (apiResp.ok) {
        var livePayload = await apiResp.json();
        if (livePayload && livePayload.coaches && livePayload.coaches.length) {
          STL.shared.writeCache(CACHE_KEY, livePayload, CACHE_TTL);
          renderAll(livePayload);
          return;
        }
      }
      throw new Error('api unavailable');
    } catch (e) {
      if (basePayload) {
        try {
          var directPayload = await directBrowserVerify(basePayload);
          STL.shared.writeCache(CACHE_KEY, directPayload, CACHE_TTL);
          renderAll(directPayload);
        } catch (e2) {}
      }
    } finally {
      if (syncBtn) {
        syncBtn.disabled = false;
        syncBtn.textContent = 'Sync';
      }
    }
  }

  grid.addEventListener('error', function(e) {
    var img = e.target;
    if (img && img.classList && img.classList.contains('coach-photo')) {
      var wrap = img.closest('.coach-avatar');
      if (wrap) wrap.classList.add('is-fallback');
    }
  }, true);

  grid.addEventListener('click', function(e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-toggle-coach]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-toggle-coach');
    var card = btn.closest('.teamcard');
    if (!card) return;
    var open = card.classList.toggle('open');
    openState[id] = open;
    btn.textContent = open ? '\u2013 close' : '+ details';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    syncExpandBtn();
  });

  expandBtn.addEventListener('click', function() {
    var cards = grid.querySelectorAll('.teamcard');
    var allOpen = Array.prototype.every.call(cards, function(el) { return el.classList.contains('open'); });
    Array.prototype.forEach.call(cards, function(card) {
      var open = !allOpen;
      var id = card.getAttribute('data-coach');
      openState[id] = open;
      card.classList.toggle('open', open);
      var btn = card.querySelector('[data-toggle-coach]');
      if (btn) {
        btn.textContent = open ? '\u2013 close' : '+ details';
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
    });
    syncExpandBtn();
  });

  syncBtn.addEventListener('click', function() {
    loadCoaches(true);
  });

  if (lbEl) {
    lbEl.addEventListener('click', function(e) {
      var btn = e.target && e.target.closest ? e.target.closest('[data-lb-mode]') : null;
      if (!btn) return;
      var next = btn.getAttribute('data-lb-mode');
      if (next && next !== lbMode) {
        lbMode = next;
        renderLeaderboard();
      }
    });
  }

  renderLeaderboard();
  loadCoaches(false);
})();
</script>
