function safe(v) {
  return v != null ? v : '\u2014';
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function findStat(stats, name) {
  var s = stats.find(function(x) { return x.name === name; });
  return s ? s : null;
}

async function loadTeamStats(team) {
  if (team.sport === 'baseball') {
    var resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/teams/' + team.id + '/statistics');
    if (!resp.ok) return null;
    var data = await resp.json();
    var cats = data?.results?.stats?.categories;
    if (!cats) return null;
    var batting = (cats.find(function(c) { return c.name === 'batting'; }) || {}).stats || [];
    var pitching = (cats.find(function(c) { return c.name === 'pitching'; }) || {}).stats || [];
    var fv = function(arr, n) { var s = arr.find(function(x) { return x.name === n; }); return s ? s.displayValue : '&mdash;'; };
    return [
      { cat: 'Batting', items: [
        { name: 'AVG', val: fv(batting, 'avg') },
        { name: 'HR',  val: fv(batting, 'homeRuns') },
        { name: 'RBI', val: fv(batting, 'RBIs') },
      ]},
      { cat: 'Pitching', items: [
        { name: 'ERA',  val: fv(pitching, 'ERA') },
        { name: 'WHIP', val: fv(pitching, 'WHIP') },
        { name: 'K',    val: fv(pitching, 'strikeouts') },
      ]}
    ];
  }

  if (team.sport === 'soccer') {
    var resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/teams/' + team.id + '/roster?season=2026');
    if (!resp.ok) return null;
    var roster = await resp.json();
    var players = [];
    for (var i = 0; i < (roster.athletes || []).length; i++) {
      var item = roster.athletes[i];
      var cats = item.statistics?.splits?.categories;
      if (!cats) continue;
      var appsCat = cats.find(function(c) { return c.name === 'general'; });
      if (!appsCat) continue;
      var appsStat = appsCat.stats.find(function(s) { return s.name === 'appearances'; });
      if (!appsStat || !appsStat.value) continue;
      var offCat = cats.find(function(c) { return c.name === 'offensive'; });
      if (!offCat) continue;
      var gs = offCat.stats.find(function(s) { return s.name === 'totalGoals'; });
      var as = offCat.stats.find(function(s) { return s.name === 'goalAssists'; });
      players.push({
        name: item.shortName || item.displayName,
        goals: gs ? (gs.value || 0) : 0,
        assists: as ? (as.value || 0) : 0
      });
    }
    var top = function(arr, key) {
      return [...arr].sort(function(a, b) { return b[key] - a[key]; }).filter(function(p) { return p[key] > 0; }).slice(0, 5);
    };
    var result = [];
    var g = top(players, 'goals');
    if (g.length) result.push({ cat: 'Goals', items: g.map(function(p) { return { name: p.name, val: p.goals }; }) });
    var a = top(players, 'assists');
    if (a.length) result.push({ cat: 'Assists', items: a.map(function(p) { return { name: p.name, val: p.assists }; }) });
    return result.length ? result : null;
  }

  if (team.sport === 'hockey') {
    var resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/' + team.id);
    if (!resp.ok) return null;
    var data = await resp.json();
    var ne = data?.team?.nextEvent?.[0];
    if (!ne) return null;
    var comps = ne.competitions?.[0]?.competitors;
    if (!comps) return null;
    var us = null;
    for (var j = 0; j < comps.length; j++) {
      if (String(comps[j].team.id) === String(team.id)) { us = comps[j]; break; }
    }
    if (!us) return null;
    var leaders = us?.roster?.leaders;
    if (!leaders) return null;
    var seen = {};
    for (var g = 0; g < leaders.length; g++) {
      var group = leaders[g];
      for (var k = 0; k < (group.leaders || []).length; k++) {
        var entry = group.leaders[k];
        var pid = entry.athlete?.id;
        if (!pid || seen[pid]) continue;
        var pcats = entry.statistics?.splits?.categories;
        if (!pcats) continue;
        var off = pcats.find(function(c) { return c.name === 'offensive'; });
        if (!off) continue;
        var ytdG = off.stats.find(function(s) { return s.name === 'ytdGoals'; });
        var pts = off.stats.find(function(s) { return s.name === 'points'; });
        var ast = off.stats.find(function(s) { return s.name === 'assists'; });
        if (!ytdG || !pts) continue;
        seen[pid] = {
          name: entry.athlete.shortName || entry.athlete.displayName,
          goals: ytdG.value ?? 0,
          assists: ast ? (ast.value ?? 0) : 0,
          points: pts.value ?? 0
        };
      }
    }
    var items = Object.values(seen).filter(function(p) { return p.goals > 0 || p.points > 0; });
    if (!items.length) return null;
    var byPts = [...items].sort(function(a, b) { return b.points - a.points; }).slice(0, 5);
    var byG = [...items].sort(function(a, b) { return b.goals - a.goals; }).slice(0, 5);
    var result = [];
    var gs = byG.filter(function(p) { return p.goals > 0; });
    if (gs.length) result.push({ cat: 'Goals', items: gs.map(function(p) { return { name: p.name, val: p.goals }; }) });
    result.push({ cat: 'Points', items: byPts.map(function(p) { return { name: p.name, val: p.points }; }) });
    return result;
  }

  if (team.sport === 'football') {
    var resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/ufl/teams/' + team.id + '/statistics');
    if (!resp.ok) return null;
    var data = await resp.json();
    var cats = data?.results?.stats?.categories;
    if (!cats) return null;
    var passing = (cats.find(function(c) { return c.name === 'passing'; }) || {}).stats || [];
    var rushing = (cats.find(function(c) { return c.name === 'rushing'; }) || {}).stats || [];
    var receiving = (cats.find(function(c) { return c.name === 'receiving'; }) || {}).stats || [];
    var fv = function(arr, n) { var s = arr.find(function(x) { return x.name === n; }); return s ? s.displayValue : '&mdash;'; };
    return [
      { cat: 'Passing', items: [
        { name: 'YDS', val: fv(passing, 'passingYards') },
        { name: 'TD',  val: fv(passing, 'touchdowns') },
        { name: 'INT', val: fv(passing, 'interceptions') },
      ]},
      { cat: 'Rushing', items: [
        { name: 'YDS', val: fv(rushing, 'rushingYards') },
        { name: 'TD',  val: fv(rushing, 'touchdowns') },
      ]},
      { cat: 'Receiving', items: [
        { name: 'YDS', val: fv(receiving, 'receivingYards') },
        { name: 'TD',  val: fv(receiving, 'touchdowns') },
      ]}
    ];
  }

  return null;
}

async function loadUFLCoaching() {
  var resp = await fetch('https://site.api.espn.com/apis/v2/sports/football/ufl/standings');
  if (!resp.ok) return null;
  var data = await resp.json();
  var entries = data?.standings?.entries || [];
  var teamMap = {}, logoMap = {};
  for (var i = 0; i < entries.length; i++) {
    var t = entries[i].team;
    var wStat = entries[i].stats.find(function(s) { return s.name === 'wins'; });
    var lStat = entries[i].stats.find(function(s) { return s.name === 'losses'; });
    var pfStat = entries[i].stats.find(function(s) { return s.name === 'pointsFor'; });
    var paStat = entries[i].stats.find(function(s) { return s.name === 'pointsAgainst'; });
    var diffStat = entries[i].stats.find(function(s) { return s.name === 'pointDifferential'; });
    teamMap[String(t.id)] = { w: wStat ? wStat.value : 0, l: lStat ? lStat.value : 0, pf: pfStat ? pfStat.value : null, pa: paStat ? paStat.value : null, diff: diffStat ? diffStat.value : null };
    if (t.logos && t.logos.length) logoMap[String(t.id)] = t.logos[0].href;
  }
  var html = '<div class="section">' +
    '<div class="section-header" style="border-bottom-color:#888;">' +
      '<h2 style="color:#888;">Spring Football Franchise Records</h2>' +
    '</div>' +
    '<div class="stat-group">' +
      '<div class="stat-group-title">XFL \u00B7 USFL \u00B7 UFL</div>';
  var sorted = UFL_FRANCHISES.slice().sort(function(a, b) {
    var aR = teamMap[a.currentId];
    var bR = teamMap[b.currentId];
    var aPct = aR ? aR.w / (aR.w + aR.l) : 0;
    var bPct = bR ? bR.w / (bR.w + bR.l) : 0;
    return bPct - aPct;
  });
  for (var f = 0; f < sorted.length; f++) {
    var frac = sorted[f];
    html += '<div style="margin-bottom:16px;">' +
      '<div style="display:flex;align-items:center;gap:8px;font-size:0.75rem;font-weight:600;color:' + frac.color + ';text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #1a1a1a;">' +
        ((logoMap[frac.currentId] || frac.logo) ? '<img src="' + (logoMap[frac.currentId] || frac.logo) + '" style="width:24px;height:24px;object-fit:contain;">' : '') +
        escHtml(frac.name) +
      '</div>';
    for (var h = 0; h < frac.history.length; h++) {
      var rec = frac.history[h];
      var yearLabel = '(' + rec.year + (rec.league ? ' ' + rec.league : '') + ')';
      html += '<div class="player-row">' +
        '<span class="player-name">' + escHtml(rec.coach) + ' <span style="color:#666;font-size:0.75rem;">' + yearLabel + (rec.champ ? ' \uD83C\uDFC6' : '') + '</span></span>' +
        '<span class="player-val">' + (rec.pf != null ? '<span style="color:#666;font-size:0.75rem;margin-right:12px;">PF ' + rec.pf + ' | PA ' + rec.pa + ' | ' + (rec.pf - rec.pa > 0 ? '+' : '') + (rec.pf - rec.pa) + '</span> ' : '') + rec.w + '-' + rec.l + '</span>' +
      '</div>';
      if (rec.teamName) {
        html += '<div class="player-row"><span class="player-name" style="color:#555;font-size:0.75rem;padding-left:16px;">' + escHtml(rec.teamName) + '</span><span class="player-val"></span></div>';
      }
    }
    var curW = 0, curL = 0;
    var cur = null;
    if (frac.coach2026) {
      cur = teamMap[frac.currentId];
      curW = cur ? cur.w : 0;
      curL = cur ? cur.l : 0;
      html += '<div class="player-row" style="font-weight:600;">' +
        '<span class="player-name">' + escHtml(frac.coach2026) + ' <span style="color:#666;font-size:0.75rem;">(2026 UFL)' + (frac.champ2026 ? ' \uD83C\uDFC6' : '') + '</span></span>' +
        '<span class="player-val">' + (cur && cur.pf != null ? '<span style="color:#666;font-size:0.75rem;margin-right:12px;">PF ' + cur.pf + ' | PA ' + cur.pa + ' | ' + (cur.diff > 0 ? '+' : '') + cur.diff + '</span> ' : '') + curW + '-' + curL + '</span>' +
      '</div>';
    }
    if (frac.coach2027) {
      // 2027 hasn't been played: static 0-0 with zero PF/PA. Deliberately not
      // sourced from teamMap — a currentId would show that team's stale 2026 numbers.
      html += '<div class="player-row" style="font-weight:600;">' +
        '<span class="player-name">' + escHtml(frac.coach2027) + ' <span style="color:#666;font-size:0.75rem;">(2027 UFL)</span></span>' +
        '<span class="player-val"><span style="color:#666;font-size:0.75rem;margin-right:12px;">PF 0 | PA 0 | 0</span> 0-0</span>' +
      '</div>';
    }
    var totW = 0, totL = 0, totPF = 0, totPA = 0;
    for (var j = 0; j < frac.history.length; j++) { totW += frac.history[j].w; totL += frac.history[j].l; if (frac.history[j].pf != null) { totPF += frac.history[j].pf; totPA += frac.history[j].pa; } }
    if (cur && cur.pf != null) { totPF += cur.pf; totPA += cur.pa; }
    totW += curW; totL += curL;
      html += '<div class="player-row" style="border-top:1px solid #2a2a2a;color:#aaa;">' +
        '<span class="player-name" style="color:#aaa;font-size:0.8rem;">Franchise Total</span>' +
        '<span class="player-val" style="color:#aaa;"><span style="color:#888;font-size:0.75rem;margin-right:12px;">PF ' + totPF + ' | PA ' + totPA + ' | ' + (totPF - totPA > 0 ? '+' : '') + (totPF - totPA) + '</span> ' + totW + '-' + totL + '</span>' +
      '</div>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderAttendanceChart() {
  var attCanvas = document.getElementById('attChart');
  var attTooltip = document.getElementById('attTooltip');
  var attChartWrap = document.getElementById('attChartWrap');
  var attStatsEl = document.getElementById('attStatsRow');
  if (!attCanvas || !attChartWrap) return;
  var ctx = attCanvas.getContext('2d');

  var BLUE = '#00529B';
  var BLUE_GLOW = 'rgba(0, 82, 155, 0.25)';
  var GRID_COLOR = '#2a2a2a';
  var TEXT_COLOR = '#888';

  var DPR = window.devicePixelRatio || 1;
  var W = 920;
  var H = 480;
  attCanvas.width = W * DPR;
  attCanvas.height = H * DPR;
  attCanvas.style.width = W + 'px';
  attCanvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);

  var PAD = { top: 30, right: 20, bottom: 30, left: 60 };
  var plotW = W - PAD.left - PAD.right;
  var plotH = H - PAD.top - PAD.bottom;

  var allGames = ATTENDANCE.flatMap(function(s) { return s.games; });
  var maxAtt = Math.max.apply(null, allGames.map(function(g) { return g.attendance; }));
  var minAtt = Math.min.apply(null, allGames.map(function(g) { return g.attendance; }));
  var avgAtt = Math.round(allGames.reduce(function(s, g) { return s + g.attendance; }, 0) / allGames.length);
  var yMin = Math.max(0, Math.floor(minAtt / 5000) * 5000 - 5000);
  var yMax = Math.ceil(maxAtt / 5000) * 5000 + 5000;

  var flatData = [];
  ATTENDANCE.forEach(function(s, si) {
    s.games.forEach(function(g, gi) {
      flatData.push({
        opponent: g.opponent,
        date: g.date,
        attendance: g.attendance,
        seasonIdx: si,
        gameInSeason: gi,
        seasonGames: s.games.length,
      });
    });
  });

  var totalGap = ATTENDANCE.length - 1;
  var segmentWidth = plotW / (flatData.length + totalGap);
  var gapWidth = segmentWidth;

  function getX(idx) {
    var x = PAD.left + idx * segmentWidth;
    for (var s = 0; s < ATTENDANCE.length - 1; s++) {
      var gamesBefore = ATTENDANCE.slice(0, s + 1).reduce(function(sum, seas) { return sum + seas.games.length; }, 0);
      if (idx >= gamesBefore) {
        x += gapWidth;
      }
    }
    return x;
  }

  var points = flatData.map(function(g, i) {
    var x = getX(i);
    var y = PAD.top + plotH - ((g.attendance - yMin) / (yMax - yMin)) * plotH;
    return { x: x, y: y, data: g, index: i };
  });

  function scaleY(val) {
    return PAD.top + plotH - ((val - yMin) / (yMax - yMin)) * plotH;
  }

  var seasonLabels = [];
  var globalIdx = 0;
  ATTENDANCE.forEach(function(s) {
    var start = globalIdx;
    globalIdx += s.games.length;
    var end = globalIdx;
    var midIdx = start + (end - start - 1) / 2;
    seasonLabels.push({ x: getX(midIdx), label: String(s.season) });
  });

  function formatAtt(n) {
    return n.toLocaleString();
  }

  // Least-squares trendline over game order (0..n-1 vs attendance)
  var TREND_COLOR = '#ff9f43';
  var trendN = flatData.length;
  var trendSumX = 0, trendSumY = 0, trendSumXY = 0, trendSumX2 = 0;
  flatData.forEach(function(g, i) {
    trendSumX += i;
    trendSumY += g.attendance;
    trendSumXY += i * g.attendance;
    trendSumX2 += i * i;
  });
  var trendSlope = (trendN * trendSumXY - trendSumX * trendSumY) / (trendN * trendSumX2 - trendSumX * trendSumX);
  var trendIntercept = (trendSumY - trendSlope * trendSumX) / trendN;
  function trendAt(i) {
    return trendIntercept + trendSlope * i;
  }
  var trendDir = trendSlope < 0 ? 'downward' : 'upward';

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 1;
    var yStep = 5000;
    for (var y = yMin; y <= yMax; y += yStep) {
      var yy = scaleY(y);
      ctx.beginPath();
      ctx.moveTo(PAD.left, yy);
      ctx.lineTo(W - PAD.right, yy);
      ctx.stroke();
      ctx.fillStyle = TEXT_COLOR;
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(formatAtt(y), PAD.left - 8, yy);
    }

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ATTENDANCE.forEach(function(s, si) {
      if (si === 0) return;
      var before = ATTENDANCE.slice(0, si).reduce(function(sum, sea) { return sum + sea.games.length; }, 0);
      var x = getX(before - 1) + segmentWidth / 2 + gapWidth / 2;
      ctx.beginPath();
      ctx.moveTo(x, PAD.top);
      ctx.lineTo(x, PAD.top + plotH);
      ctx.stroke();
    });
    ctx.setLineDash([]);

    var avgY = scaleY(avgAtt);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(PAD.left, avgY);
    ctx.lineTo(W - PAD.right, avgY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Avg ' + formatAtt(avgAtt), W - PAD.right - 4, avgY - 4);

    // One continuous line across all seasons (through the season gaps)
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = BLUE_GLOW;
    ctx.lineWidth = 6;
    ctx.beginPath();
    points.forEach(function(p, i) {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    points.forEach(function(p, i) {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();

    // Trendline (least squares), clipped to the plot area
    ctx.save();
    ctx.beginPath();
    ctx.rect(PAD.left, PAD.top, plotW, plotH);
    ctx.clip();
    ctx.strokeStyle = TREND_COLOR;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 5]);
    ctx.beginPath();
    ctx.moveTo(points[0].x, scaleY(trendAt(0)));
    ctx.lineTo(points[points.length - 1].x, scaleY(trendAt(trendN - 1)));
    ctx.stroke();
    ctx.restore();
    ctx.setLineDash([]);
    ctx.fillStyle = TREND_COLOR;
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Trend (' + trendDir + ')', W - PAD.right - 4, scaleY(trendAt(trendN - 1)) - 4);

    points.forEach(function(p) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = BLUE;
      ctx.fill();
      ctx.strokeStyle = '#0d0d0d';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });

    seasonLabels.forEach(function(sl) {
      ctx.fillStyle = '#666';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(sl.label, sl.x, PAD.top + plotH + 8);
    });
  }

  function getNearest(e) {
    var rect = attCanvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var mx = (e.clientX - rect.left) * scaleX;
    var my = (e.clientY - rect.top) * scaleX;

    var best = null;
    var bestDist = Infinity;
    points.forEach(function(p) {
      var dx = p.x - mx;
      var dy = p.y - my;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestDist) {
        bestDist = d;
        best = p;
      }
    });

    if (best && bestDist < 30) return best;
    return null;
  }

  function showTooltip(p) {
    var g = p.data;
    attTooltip.innerHTML =
      '<div class="att">' + formatAtt(g.attendance) + '</div>' +
      '<div class="opp">vs ' + escHtml(g.opponent) + '</div>' +
      '<div class="date">' + escHtml(g.date) + ' &middot; ' + (g.seasonIdx === 0 ? 'XFL' : 'UFL') + '</div>';
    attTooltip.style.display = 'block';

    var rect = attChartWrap.getBoundingClientRect();
    var scaleX = W / attCanvas.getBoundingClientRect().width;
    var tx = p.x / scaleX;
    var ty = p.y / scaleX;

    var left = tx + 12;
    var top = ty - 8;

    if (left + 200 > rect.width) left = tx - 12 - 200;
    if (top < 0) top = 8;

    attTooltip.style.left = left + 'px';
    attTooltip.style.top = top + 'px';
  }

  function hideTooltip() {
    attTooltip.style.display = 'none';
  }

  attCanvas.onmousemove = function(e) {
    var p = getNearest(e);
    if (p) {
      showTooltip(p);
      attCanvas.style.cursor = 'crosshair';
    } else {
      hideTooltip();
      attCanvas.style.cursor = 'default';
    }
  };

  attCanvas.onmouseleave = hideTooltip;

  var legendEl = document.createElement('div');
  legendEl.className = 'legend';
  legendEl.innerHTML =
    '<div class="legend-item">' +
      '<span class="legend-dot" style="background:' + BLUE + ';"></span>' +
      'Home game attendance' +
    '</div>' +
    '<div class="legend-item">' +
      '<span class="legend-line" style="background:rgba(255,255,255,0.3);border-top:2px dashed rgba(255,255,255,0.3);"></span>' +
      'Average (' + formatAtt(avgAtt) + ')' +
    '</div>' +
    '<div class="legend-item">' +
      '<span class="legend-line" style="background:' + TREND_COLOR + ';border-top:2px dashed ' + TREND_COLOR + ';"></span>' +
      'Trendline (' + trendDir + ')' +
    '</div>';
  attChartWrap.appendChild(legendEl);

  if (attStatsEl) {
    var bestAtt = Math.max.apply(null, allGames.map(function(g) { return g.attendance; }));
    var worstAtt = Math.min.apply(null, allGames.map(function(g) { return g.attendance; }));
    var bestGame = allGames.filter(function(g) { return g.attendance === bestAtt; })[0];
    var worstGame = allGames.filter(function(g) { return g.attendance === worstAtt; })[0];
    attStatsEl.innerHTML =
      '<div class="stat-item"><div class="num" style="color:#5a9eff;font-weight:700;font-size:1rem;">' + allGames.length + '</div><div class="lbl" style="color:#888;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Home Games</div></div>' +
      '<div class="stat-item" style="text-align:center;"><div class="num" style="color:#5a9eff;font-weight:700;font-size:1rem;">' + formatAtt(avgAtt) + '</div><div class="lbl" style="color:#888;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Avg Attendance</div></div>' +
      '<div class="stat-item" style="text-align:center;"><div class="num" style="color:#5a9eff;font-weight:700;font-size:1rem;">' + formatAtt(bestAtt) + '</div><div class="lbl" style="color:#888;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Best (vs ' + escHtml(bestGame.opponent) + ', ' + escHtml(bestGame.date) + ')</div></div>' +
      '<div class="stat-item" style="text-align:center;"><div class="num" style="color:#5a9eff;font-weight:700;font-size:1rem;">' + formatAtt(worstAtt) + '</div><div class="lbl" style="color:#888;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Worst (vs ' + escHtml(worstGame.opponent) + ', ' + escHtml(worstGame.date) + ')</div></div>';
  }

  draw();

  function resizeAttCanvas() {
    var rect = attChartWrap.getBoundingClientRect();
    var maxW = Math.min(920, rect.width - 32);
    if (maxW <= 0) return;
    attCanvas.style.width = maxW + 'px';
    attCanvas.style.height = (maxW / W * H) + 'px';
  }
  resizeAttCanvas();
  window.addEventListener('resize', resizeAttCanvas);
}

async function loadStats() {
  var container = document.getElementById('statsContent');
  var sub = document.getElementById('feedSub');
  try {
    var results = await Promise.all(TEAMS.map(function(t) { return loadTeamStats(t); }));
    var html = '';
    var loaded = 0;
    for (var i = 0; i < TEAMS.length; i++) {
      var groups = results[i];
      if (!groups || !groups.length) continue;
      loaded++;
      html += '<div class="section">' +
        '<div class="section-header" style="border-bottom-color:' + TEAMS[i].color + ';">' +
          '<h2 style="color:' + TEAMS[i].color + ';">' + escHtml(TEAMS[i].name) + '</h2>' +
        '</div>';
      var groupHtml = '';
      for (var g = 0; g < groups.length; g++) {
        var group = groups[g];
        groupHtml += '<div class="stat-group">' +
            '<div class="stat-group-title">' + escHtml(safe(group.cat)) + '</div>';
        for (var k = 0; k < group.items.length; k++) {
          var p = group.items[k];
          groupHtml += '<div class="player-row">' +
            '<span class="player-name">' + escHtml(safe(p.name)) + '</span>' +
            '<span class="player-val">' + escHtml(safe(String(p.val))) + '</span>' +
          '</div>';
        }
        groupHtml += '</div>';
      }
      html += '<div class="stat-groups">' + groupHtml + '</div>';
      html += '</div>';
    }
    if (!loaded) {
      container.innerHTML = '<div class="error-msg">Could not load stats data.</div>';
      sub.textContent = 'Error';
      return;
    }
    var coachingHtml = await loadUFLCoaching();
    if (coachingHtml) html += coachingHtml;
    html += '<div class="section" id="attendance">' +
      '<div class="section-header" style="border-bottom-color:#00529B;">' +
        '<h2 style="color:#00529B;">BattleHawks Home Attendance</h2>' +
      '</div>' +
      '<div class="stat-group-title">Every home game since 2020</div>' +
      '<div class="chart-wrap" id="attChartWrap">' +
        '<canvas id="attChart" width="920" height="480"></canvas>' +
        '<div class="tooltip" id="attTooltip"></div>' +
      '</div>' +
      '<div class="att-stats" id="attStatsRow"></div>' +
      '<div class="att-data-src">Data from sports-reference.com and official team releases</div>' +
    '</div>';
    sub.textContent = loaded + ' team' + (loaded !== 1 ? 's' : '');
    container.innerHTML = html;
    renderAttendanceChart();
  } catch (e) {
    container.innerHTML = '<div class="error-msg">Failed to load stats.</div>';
    sub.textContent = 'Error';
  }
}
loadStats();
